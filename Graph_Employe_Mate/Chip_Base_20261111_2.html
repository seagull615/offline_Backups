    tip.innerHTML = tipHtml(chip.dataset.n, spec); tip.style.display = 'block';
    var r = chip.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    var x = Math.max(8, Math.min(r.left, window.innerWidth - tw - 8));
    var y = r.bottom + 6;
    if (y + th > window.innerHeight - 8) y = Math.max(8, r.top - th - 6);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  function hideTip() { tip.style.display = 'none'; }
  document.addEventListener('scroll', hideTip, true);

  function initFocus(cfg) {
    var KEY = cfg.key;
    var bar = document.getElementById(cfg.barId);
    var list = document.getElementById(cfg.listId);
    var data = load();
    var items = data.items, specs = data.specs;
    var ed = null;      // { i: index or -1 }
    var drag = null;

    function load() {
      var r = { items: cfg.defaults.slice(), specs: {} };
      try {
        var raw = localStorage.getItem(KEY);
        if (raw === null) return r;
        var o = JSON.parse(raw);
        if (o && Array.isArray(o.items)) r.items = o.items.filter(function (x) { return typeof x === 'string' && x; });
        if (o && o.specs && typeof o.specs === 'object') for (var k in o.specs) if (typeof o.specs[k] === 'string') r.specs[k] = o.specs[k];
      } catch (e) {}
      return r;
    }
    function prune() {
      var used = {}; items.forEach(function (n) { used[n] = 1; });
      Object.keys(specs).forEach(function (n) { if (!used[n] || !specs[n].trim()) delete specs[n]; });
    }
    function save() { prune(); try { localStorage.setItem(KEY, JSON.stringify({ items: items, specs: specs })); } catch (e) {} }

    function closePop() { var p = bar.querySelector('.fpop'); if (p) p.remove(); }
    function openPop(chipEl, i) {
      closePop();
      var name = i >= 0 ? items[i] : '';
      var pop = document.createElement('div'); pop.className = 'fpop';
      pop.innerHTML =
        '<input class="fname" type="text" maxlength="60" autocomplete="off" placeholder="' + esc(cfg.placeholder) + '" value="' + esc(name) + '">' +
        '<textarea class="fspec" placeholder="상세를 적어 주세요. 줄마다 &quot;항목: 값&quot; 으로 쓰면 항목이 굵게 보여요.&#10;예)&#10;목표: …&#10;기한: …"></textarea>' +
        '<div class="pb"><button type="button" class="act" data-act="save">확인</button><button type="button" data-act="cancel">취소</button><span class="sp"></span>' +
        (i >= 0 ? '<button type="button" class="danger" data-act="del">삭제</button>' : '') + '</div>';
      pop.querySelector('.fspec').value = i >= 0 ? (specs[name] || '') : '';
      bar.appendChild(pop);
      var br = bar.getBoundingClientRect(), cr = chipEl.getBoundingClientRect();
      var left = Math.max(14, Math.min(cr.left - br.left, br.width - pop.offsetWidth - 14));
      pop.style.left = left + 'px';
      var inp = pop.querySelector('.fname'); inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {}
    }
    function commit() {
      var pop = bar.querySelector('.fpop'); if (!pop || !ed) return;
      var nm = pop.querySelector('.fname').value.replace(/\s+/g, ' ').trim();
      var sp = pop.querySelector('.fspec').value.replace(/\s+$/, '');
      if (!nm) { if (ed.i >= 0) items.splice(ed.i, 1); }
      else {
        if (ed.i >= 0) { if (items[ed.i] !== nm) delete specs[items[ed.i]]; items[ed.i] = nm; } else items.push(nm);
        if (sp.trim()) specs[nm] = sp; else delete specs[nm];
        items = items.filter(function (n, k) { return items.indexOf(n) === k; });
      }
      ed = null; save(); render();
    }
    function cancel() { ed = null; render(); }

    function render() {
      closePop(); hideTip();
      list.textContent = '';
      items.forEach(function (n, i) {
        var chip = document.createElement('span');
        chip.className = 'fchip' + ((specs[n] || '').trim() ? '' : ' nospec') + (ed && ed.i === i ? ' on' : '');
        chip.draggable = true; chip.dataset.i = i; chip.dataset.n = n; chip.innerHTML = mx(n);
        list.appendChild(chip);
      });
      var add = document.createElement('button'); add.type = 'button'; add.className = 'fadd'; add.textContent = '＋ ' + cfg.addLabel;
      list.appendChild(add);
      if (!items.length) {
        var em = document.createElement('span'); em.className = 'fempty'; em.textContent = cfg.empty;
        list.insertBefore(em, add);
      }
      if (ed) openPop(ed.i >= 0 ? list.querySelector('.fchip[data-i="' + ed.i + '"]') : add, ed.i);
    }

    list.addEventListener('click', function (e) {
      var chip = e.target.closest('.fchip'), add = e.target.closest('.fadd');
      if (chip) { var i = parseInt(chip.dataset.i, 10); ed = (ed && ed.i === i) ? null : { i: i }; render(); }
      else if (add) { ed = { i: -1 }; render(); }
    });
    list.addEventListener('mouseover', function (e) { var c = e.target.closest('.fchip'); if (c && !drag) showTip(c, specs[c.dataset.n]); });
    list.addEventListener('mouseout', function (e) { if (e.target.closest('.fchip')) hideTip(); });

    bar.addEventListener('click', function (e) {
      var a = e.target.closest('[data-act]'); if (!a || !ed) return;
      if (a.dataset.act === 'save') commit();
      else if (a.dataset.act === 'cancel') cancel();
      else if (a.dataset.act === 'del') { items.splice(ed.i, 1); ed = null; save(); render(); }
    });
    bar.addEventListener('keydown', function (e) {
      var t = e.target; if (!t.classList || e.isComposing || e.keyCode === 229) return;
      var isN = t.classList.contains('fname'), isS = t.classList.contains('fspec');
      if (!isN && !isS) return;
      if (e.key === 'Escape') cancel();
      else if (e.key === 'Enter' && (isN || e.ctrlKey || e.metaKey)) { e.preventDefault(); commit(); }
    });
    document.addEventListener('mousedown', function (e) {
      if (!ed || bar.contains(e.target)) return;
      commit();
    });

    // 드래그로 순서 변경
    function clearDrop() { var o = list.querySelectorAll('.dropbefore'); for (var i = 0; i < o.length; i++) o[i].classList.remove('dropbefore'); }
    list.addEventListener('dragstart', function (e) {
      var c = e.target.closest('.fchip'); if (!c) return;
      drag = parseInt(c.dataset.i, 10); hideTip(); closePop();
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', c.dataset.n); } catch (x) {}
      c.classList.add('dragging');
    });
    list.addEventListener('dragover', function (e) {
      if (drag === null) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      clearDrop();
      var c = e.target.closest('.fchip'); if (c) c.classList.add('dropbefore');
    });
    list.addEventListener('drop', function (e) {
      if (drag === null) return;
      e.preventDefault(); clearDrop();
      var c = e.target.closest('.fchip');
      var at = c ? parseInt(c.dataset.i, 10) : items.length;
      var name = items[drag];
      if (name !== undefined) {
        items.splice(drag, 1); if (at > drag) at--;
        items.splice(at, 0, name); save();
      }
      drag = null; ed = null; render();
    });
    list.addEventListener('dragend', function () { drag = null; clearDrop(); var d = list.querySelectorAll('.dragging'); for (var i = 0; i < d.length; i++) d[i].classList.remove('dragging'); });

    // 전달 문장 복사
    document.getElementById(cfg.copyId).addEventListener('click', function () {
      var btn = this;
      if (!items.length) return;
      var text = cfg.prefix + items.join(' / ');
      var det = items.filter(function (n) { return (specs[n] || '').trim(); });
      if (det.length) text += '\n\n' + det.map(function (n) { return '[' + n + ']\n' + specs[n].trim(); }).join('\n\n');
      function ok() { var o = btn.textContent; btn.textContent = '✓ 복사됨 · 붙여넣어 전달하세요'; setTimeout(function () { btn.textContent = o; }, 2200); }
      function fallback() {
        var ta = document.createElement('textarea'); ta.value = text;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); ok(); } catch (e) {}
        ta.remove();
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
      else fallback();
    });

    if (localStorage.getItem(KEY) === null) save();
    render();
  }

  initFocus({ key: 'my-focus-v1', barId: 'focusbar', defaults: ['크로마넷 내부문서 만들기', 'CPS 테스트하기'], listId: 'focusList', copyId: 'focusCopy', placeholder: '지금 하는 일', addLabel: '방향', empty: '지금 집중하는 일을 적어두세요', prefix: '지금 제가 집중하고 있는 일: ' });
  initFocus({ key: 'company-focus-v1', barId: 'companyBar', defaults: [], listId: 'companyList', copyId: 'companyCopy', placeholder: '회사가 가는 방향', addLabel: '방향', empty: '회사가 나아가는 방향을 적어두세요', prefix: '지금 우리 회사가 나아가는 방향: ' });
})();
</script>
<script>
// JSON 저장 / 불러오기 — 모든 탭(사진 메모·설정, 일정표, 무제 칩, 나의 방향/회사의 방향)의 데이터를 한 파일로 묶어요
(function () {
  var APP = 'Chip_Base';
  // 저장 대상 키 (사진 목록 캐시는 GitHub에서 다시 받아오므로 제외)
  var EXACT = ['timetable-v1', 'untitled-chips-v1', 'my-focus-v1', 'company-focus-v1', 'photo-split-v1', 'mate-active-tab'];
  var PREFIX = ['lab-photo-', 'space-photo-'];
  function wanted(k) {
    if (/-cache-v\d+$/.test(k)) return false;
    if (EXACT.indexOf(k) >= 0) return true;
    for (var i = 0; i < PREFIX.length; i++) if (k.indexOf(PREFIX[i]) === 0) return true;
    return false;
  }
  var msg = document.getElementById('jmsg'), timer = null;
  function say(t, err) {
    msg.textContent = t || ''; msg.className = err ? 'err' : ''; msg.title = t || '';
    clearTimeout(timer); if (t) timer = setTimeout(function () { msg.textContent = ''; }, 6000);
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  document.getElementById('jsave').addEventListener('click', function () {
    var data = {}, n = 0;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (wanted(k)) { data[k] = localStorage.getItem(k); n++; }
      }
    } catch (e) { say('저장 실패: 브라우저 저장소를 읽을 수 없어요', true); return; }
    var d = new Date();
    var out = { app: APP, version: 1, savedAt: d.toISOString(), data: data };
    var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = APP + '_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    say('✓ ' + n + '개 항목을 JSON으로 저장했어요');
  });

  var fileEl = document.getElementById('jfile');
  document.getElementById('jload').addEventListener('click', function () { fileEl.value = ''; fileEl.click(); });
  fileEl.addEventListener('change', function () {
    var f = fileEl.files && fileEl.files[0]; if (!f) return;
    var r = new FileReader();
    r.onerror = function () { say('파일을 읽지 못했어요', true); };
    r.onload = function () {
      var o;
      try { o = JSON.parse(String(r.result)); } catch (e) { say('JSON 형식이 올바르지 않아요', true); return; }
      if (!o || o.app !== APP || !o.data || typeof o.data !== 'object') { say('Chip_Base에서 저장한 JSON 파일이 아니에요', true); return; }
      var keys = Object.keys(o.data).filter(function (k) { return wanted(k) && typeof o.data[k] === 'string'; });
      if (!keys.length) { say('불러올 데이터가 없어요', true); return; }
      var when = o.savedAt ? ' (' + String(o.savedAt).slice(0, 16).replace('T', ' ') + ' UTC 저장본)' : '';
      if (!confirm('현재 데이터를 이 파일의 내용으로 덮어쓸까요?' + when + '\n항목 ' + keys.length + '개가 복원되고 페이지가 새로고침돼요.')) return;
      try {
        // 대상 키는 먼저 모두 지운 뒤 파일 내용으로 채워요 (파일에 없는 항목이 남지 않도록)
        var del = [];
        for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (wanted(k)) del.push(k); }
        del.forEach(function (k) { localStorage.removeItem(k); });
        keys.forEach(function (k) { localStorage.setItem(k, o.data[k]); });
      } catch (e) { say('복원 중 오류: 저장 공간이 부족하거나 막혀 있어요', true); return; }
      location.reload();
    };
    r.readAsText(f);
  });
})();
</script>
