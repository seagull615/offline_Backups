&lt;style&gt;
  :root {

  body {

  .title { font-weight: 600; font-size: 15px; word-break: break-word; }

  .meta a { color: var(--blue1); }
  .del { border: 0; background: none; color: #b33; cursor: pointer; font-size: 12px; }
  .edit { border: 0; background: none; color: var(--blue1); cursor: pointer; font-size: 12px; }
  .title[data-tid] { cursor: text; }
  .titleinput { width: 100%; font: inherit; font-weight: 600; font-size: 15px; padding: 3px 6px; border: 2px solid var(--blue1); border-radius: 6px; color: var(--text); background: #fff; }
  .emptymsg { text-align: center; color: var(--muted); padding: 50px 10px; grid-column: 1 / -1; }
  .notice { background: #fffbe0; border: 1px solid #f0e6a0; border-radius: 12px; padding: 10px 14px; margin-bottom: 18px; font-size: 13px; }
  select.badge { border: 0; cursor: pointer; font-family: inherit; }

  dialog { border: 0; border-radius: 16px; padding: 0; width: min(440px, 92vw); max-height: 90vh; }
  dialog::backdrop { background: rgba(20,30,45,.45); }
  .form { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .form h2 { margin: 0 0 4px; font-size: 18px; }
  .form label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  .form input[type=text], .form input[type=url], .form textarea, .form input[type=file] {
    width: 100%; padding: 8px 10px; border: 1px solid #d5dce5; border-radius: 8px; font: inherit; font-size: 14px; background: #fff; color: var(--text);

  .types input { display: none; }

  .types input:checked + span.interest { border-color: var(--blue1); background: #e3edff; }
  .types input:checked + span.sim { border-color: var(--lime); background: #eaf9c9; }
  .types input:checked + span.exp { border-color: var(--green); background: #fffbe0; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }

  #viewer img { max-width: 100%; max-height: 80vh; display: block; margin: 0 auto; }
  #viewer { width: min(900px, 94vw); padding: 12px; }
&lt;/style&gt;

        &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;type&quot; value=&quot;sim&quot;&gt;&lt;span class=&quot;sim&quot;&gt;🟢 내 시뮬&lt;/span&gt;&lt;/label&gt;
        &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;type&quot; value=&quot;exp&quot;&gt;&lt;span class=&quot;exp&quot;&gt;🌿 내 실험&lt;/span&gt;&lt;/label&gt;
      &lt;/div&gt;

    &lt;div&gt;&lt;label&gt;이미지 파일&lt;/label&gt;&lt;input type=&quot;file&quot; id=&quot;fFile&quot; accept=&quot;image/*&quot;&gt;&lt;/div&gt;

&lt;script&gt;
(function () {
  var KEY = &#x27;graph-archive-v1&#x27;;
  var LABEL = { interest: &#x27;관심&#x27;, sim: &#x27;내 시뮬&#x27;, exp: &#x27;내 실험&#x27; };
  var items = [], filter = &#x27;all&#x27;, goal = 10;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var d = JSON.parse(raw); items = d.items || []; goal = d.goal || 10; }
    } catch (e) { items = []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ items: items, goal: goal })); }
    catch (e) { alert(&#x27;저장 공간이 부족해요. 내보내기로 백업하거나 이미지 대신 URL을 써 보세요.&#x27;); }
  }
  function esc(s) { return String(s || &#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function (c) { return { &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || &#x27;&#x27;) ? u : &#x27;&#x27;; }
  function safeImg(u) { return /^(https?:\/\/|data:image\/)/i.test(u || &#x27;&#x27;) ? u : &#x27;&#x27;; }

  function render() {
    var n = { interest: 0, sim: 0, exp: 0 };
    items.forEach(function (i) { n[i.type]++; });
    document.getElementById(&#x27;sAll&#x27;).textContent = items.length;
    document.getElementById(&#x27;sInt&#x27;).textContent = n.interest;
    document.getElementById(&#x27;sSim&#x27;).textContent = n.sim;
    document.getElementById(&#x27;sExp&#x27;).textContent = n.exp;
    var mine = n.sim + n.exp;
    document.getElementById(&#x27;goalCur&#x27;).textContent = mine;
    document.getElementById(&#x27;goalN&#x27;).value = goal;
    document.getElementById(&#x27;goalBar&#x27;).style.width = Math.min(100, mine / goal * 100) + &#x27;%&#x27;;

    var list = items.filter(function (i) { return filter === &#x27;all&#x27; || i.type === filter; });
    var g = document.getElementById(&#x27;grid&#x27;);
    if (!list.length) { g.innerHTML = &#x27;&lt;div class=&quot;emptymsg&quot;&gt;아직 없어요. 첫 그래프를 추가해 보세요.&lt;/div&gt;&#x27;; return; }
    g.innerHTML = list.map(function (i) {
      var img = safeImg(i.img), src = safeUrl(i.src);
      return &#x27;&lt;div class=&quot;frame &#x27; + i.type + &#x27;&quot;&gt;&lt;div class=&quot;card&quot;&gt;&#x27; +
        (img ? &#x27;&lt;div class=&quot;thumb&quot; data-view=&quot;&#x27; + i.id + &#x27;&quot;&gt;&lt;img src=&quot;&#x27; + esc(img) + &#x27;&quot; alt=&quot;&quot;&gt;&lt;/div&gt;&#x27; : &#x27;&lt;div class=&quot;thumb empty&quot;&gt;이미지 없음&lt;/div&gt;&#x27;) +
        &#x27;&lt;div class=&quot;info&quot;&gt;&lt;select class=&quot;badge &#x27; + i.type + &#x27;&quot; data-type=&quot;&#x27; + i.id + &#x27;&quot; title=&quot;분류 변경&quot;&gt;&#x27; + [&#x27;interest&#x27;, &#x27;sim&#x27;, &#x27;exp&#x27;].map(function (t) { return &#x27;&lt;option value=&quot;&#x27; + t + &#x27;&quot;&#x27; + (t === i.type ? &#x27; selected&#x27; : &#x27;&#x27;) + &#x27;&gt;&#x27; + LABEL[t] + &#x27;&lt;/option&gt;&#x27;; }).join(&#x27;&#x27;) + &#x27;&lt;/select&gt;&#x27; +
        &#x27;&lt;div class=&quot;title&quot; data-tid=&quot;&#x27; + i.id + &#x27;&quot; title=&quot;클릭해서 제목 수정&quot;&gt;&#x27; + esc(i.title || &#x27;(제목 없음)&#x27;) + &#x27;&lt;/div&gt;&#x27; +
        (i.memo ? &#x27;&lt;div class=&quot;memo&quot;&gt;&#x27; + esc(i.memo) + &#x27;&lt;/div&gt;&#x27; : &#x27;&#x27;) +
        &#x27;&lt;div class=&quot;meta&quot;&gt;&lt;span&gt;&#x27; + esc(i.date) + (src ? &#x27; · &lt;a href=&quot;&#x27; + esc(src) + &#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;출처&lt;/a&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/span&gt;&#x27; +
        &#x27;&lt;span&gt;&lt;button class=&quot;edit&quot; data-edit=&quot;&#x27; + i.id + &#x27;&quot;&gt;제목 수정&lt;/button&gt;&lt;button class=&quot;del&quot; data-del=&quot;&#x27; + i.id + &#x27;&quot;&gt;삭제&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
    }).join(&#x27;&#x27;);
  }

  function resize(file, cb) {
    var r = new FileReader();
    r.onload = function () {
      var im = new Image();
      im.onload = function () {

  function startEdit(id) {
    var el = document.querySelector(&#x27;[data-tid=&quot;&#x27; + id + &#x27;&quot;]&#x27;);

    var ed = e.target.closest(&#x27;[data-edit],[data-tid]&#x27;);

  };

&lt;script&gt;
(function () {
  var KEY = &#x27;employee-mate-v1&#x27;;
  var STAGES = [&#x27;todo&#x27;, &#x27;doing&#x27;, &#x27;done&#x27;];
  var LEGACY_DONE = { done: 1, sim: 1, exp: 1 };
  var items = [], goal = 10, pendingImg = &#x27;&#x27;;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? &#x27;&#x27; : s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function (c) { return { &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || &#x27;&#x27;) ? u : &#x27;&#x27;; }
  function safeImg(u) { return /^(https?:\/\/|data:image\/)/i.test(u || &#x27;&#x27;) ? u : &#x27;&#x27;; }
  function today() { var d = new Date(), p = function (n) { return (n &lt; 10 ? &#x27;0&#x27; : &#x27;&#x27;) + n; }; return d.getFullYear() + &#x27;-&#x27; + p(d.getMonth() + 1) + &#x27;-&#x27; + p(d.getDate()); }
  function find(id) { return items.filter(function (x) { return x.id === id; })[0]; }

  // 이전 데이터 변환: v&lt;2 에서 &#x27;착수중&#x27;이던 항목은 이제 착수 전 단계인 &#x27;업무&#x27;로 봄
  function migrate(list, v) {
    return (list || []).map(function (i) {
      if (!i.status) i.status = LEGACY_DONE[i.type] ? &#x27;done&#x27; : &#x27;doing&#x27;;
      if (v &lt; 2 &amp;&amp; i.status === &#x27;doing&#x27;) i.status = &#x27;todo&#x27;;
      if (STAGES.indexOf(i.status) &lt; 0) i.status = &#x27;todo&#x27;;
      if (!Array.isArray(i.results)) i.results = [];
      if (!Array.isArray(i.feedbacks)) i.feedbacks = [];
      if (!i.id) i.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      return i;
    });
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var d = JSON.parse(raw); items = migrate(d.items, d.v || 0); goal = d.goal || 10; if (!d.v) save(); }
    } catch (e) { items = []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ v: 2, items: items, goal: goal })); return true; }
    catch (e) { alert(&#x27;저장 공간이 부족해요. 내보내기로 백업하거나 큰 파일/이미지 대신 링크를 써 보세요.&#x27;); return false; }
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  var KINDS = { results: [&#x27;📦 결과물&#x27;, &#x27;결과물&#x27;], feedbacks: [&#x27;💬 피드백&#x27;, &#x27;피드백&#x27;] };
  function fileHtml(e, editable) {
    if (!e.file || !e.file.data) return &#x27;&#x27;;
    var isImg = /^data:image\//.test(e.file.data);
    return &#x27;&lt;div class=&quot;efile&quot;&gt;&#x27; +
      (isImg ? &#x27;&lt;span class=&quot;thumb&quot; data-viewf=&quot;1&quot;&gt;&lt;img src=&quot;&#x27; + esc(e.file.data) + &#x27;&quot; alt=&quot;&quot;&gt;&lt;/span&gt;&#x27; : &#x27;&#x27;) +
      &#x27;&lt;button class=&quot;linkbtn&quot; data-a=&quot;dl&quot; title=&quot;다운로드&quot;&gt;📎 &#x27; + esc(e.file.name || &#x27;파일&#x27;) + &#x27;&lt;/button&gt;&#x27; +
      (editable ? &#x27;&lt;button class=&quot;ghost&quot; data-a=&quot;rmfile&quot;&gt;파일 제거&lt;/button&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/div&gt;&#x27;;
  }
  function entHtml(x, kind, editable) {
    var list = x[kind] || [];
    if (!list.length &amp;&amp; !editable) return &#x27;&#x27;;
    var h = &#x27;&lt;div class=&quot;sec&quot; data-kind=&quot;&#x27; + kind + &#x27;&quot;&gt;&lt;h3&gt;&lt;span&gt;&#x27; + KINDS[kind][0] + &#x27; (&#x27; + list.length + &#x27;)&lt;/span&gt;&#x27; +
      (editable ? &#x27;&lt;button class=&quot;ghost&quot; data-a=&quot;addent&quot;&gt;＋ &#x27; + KINDS[kind][1] + &#x27; 추가&lt;/button&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/h3&gt;&#x27;;
    if (!list.length) h += &#x27;&lt;div class=&quot;entempty&quot;&gt;아직 없어요. 추가 버튼을 눌러 텍스트를 쓰거나 파일을 첨부해 보세요.&lt;/div&gt;&#x27;;
    list.forEach(function (e) {
      h += &#x27;&lt;div class=&quot;ent&quot; data-eid=&quot;&#x27; + esc(e.id) + &#x27;&quot;&gt;&lt;div class=&quot;entmain&quot;&gt;&#x27; +

  function resize(file, cb) {

  &lt;div&gt;&lt;label&gt;제목 (비우면 코드의 function 이름을 자동 사용)&lt;/label&gt;&lt;input id=&quot;fName&quot; type=&quot;text&quot;&gt;&lt;/div&gt;
  &lt;div&gt;&lt;label&gt;코드 / 텍스트 (function이 아닌 메모·스크립트도 OK)&lt;/label&gt;&lt;textarea id=&quot;fCode&quot; spellcheck=&quot;false&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;

&lt;script&gt;
(function () {
  var LABEL = { optics: &#x27;광학&#x27;, control: &#x27;제어공학&#x27; };
  var KEY = &#x27;matlab-fn-v2&#x27;, FLAG = &#x27;matlab-fn-v2-init&#x27;;
  var SEED = [
    { c:&#x27;optics&#x27;, t:&#x27;&#x27;, code:
&quot;function E = beam1(x0, y0, w, Lmax, N)\n    t = linspace(-Lmax,Lmax,N); [XX,YY]=meshgrid(t,t);\n    R_moved = sqrt((XX-x0).^2+(YY-y0).^2);\n        E1 = exp(-R_moved.^2/w^2);\n    E = E1;\nend&quot; },
    { c:&#x27;optics&#x27;, t:&#x27;&#x27;, code:
&quot;function y = etaEVA(E_1, E_2)\n% 두 필드 간 오버랩 효율 (mode overlap / coupling efficiency)\n    num = abs(sum(conj(E_1(:)) .* E_2(:)))^2;\n    den = sum(abs(E_1(:)).^2) * sum(abs(E_2(:)).^2);\n    y = num ./ den;\nend&quot; }
  ];
  var items = [], filter = &#x27;all&#x27;, query = &#x27;&#x27;, editing = null;

  function uid() { return Date.now() + &#x27;&#x27; + Math.floor(Math.random() * 1000); }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) items = JSON.parse(raw);
      else if (!localStorage.getItem(FLAG)) {
        items = SEED.map(function (s) { return { id: uid(), c: s.c, t: s.t, code: s.code }; });
        localStorage.setItem(FLAG, &#x27;1&#x27;); save();
      }
    } catch (e) { items = []; }
    if (!Array.isArray(items)) items = [];
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }
  function esc(s) { return String(s == null ? &#x27;&#x27; : s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function (m) { return { &#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27; }[m]; }); }

  function titleOf(it) {
    if (it.t) return it.t;
    var names = [], re = /^[ \t]*function\s+(?:\[[^\]]*\]\s*=\s*|[A-Za-z_]\w*\s*=\s*)?([A-Za-z_]\w*)/gm, m;
    while ((m = re.exec(it.code || &#x27;&#x27;))) names.push(m[1]);
    if (names.length) return names.join(&#x27;, &#x27;);
    var first = (it.code || &#x27;&#x27;).split(&#x27;\n&#x27;).filter(function (l) { return l.trim(); })[0];
    return first ? first.replace(/^[%#\s]+/, &#x27;&#x27;).slice(0, 40) : &#x27;(제목 없음)&#x27;;
  }

  function render() {
    var list = items.filter(function (it) {
      if (filter !== &#x27;all&#x27; &amp;&amp; it.c !== filter) return false;
      return !query || (titleOf(it) + &#x27;\n&#x27; + it.code).toLowerCase().indexOf(query) &gt; -1;
    });
    var g = document.getElementById(&#x27;grid&#x27;);

    g.innerHTML = list.map(function (it) {
      return &#x27;&lt;div class=&quot;card &#x27; + esc(it.c) + &#x27;&quot;&gt;&#x27; +
        &#x27;&lt;div class=&quot;head&quot;&gt;&lt;span class=&quot;name&quot;&gt;&#x27; + esc(titleOf(it)) + &#x27;&lt;/span&gt;&lt;span class=&quot;badge &#x27; + esc(it.c) + &#x27;&quot;&gt;&#x27; + esc(LABEL[it.c] || it.c) + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27; +
        &#x27;&lt;pre&gt;&#x27; + esc(it.code) + &#x27;&lt;/pre&gt;&#x27; +
        &#x27;&lt;div class=&quot;row&quot;&gt;&lt;button class=&quot;ghost&quot; data-copy=&quot;&#x27; + esc(it.id) + &#x27;&quot;&gt;코드 복사&lt;/button&gt;&#x27; +
        &#x27;&lt;button class=&quot;ghost&quot; data-edit=&quot;&#x27; + esc(it.id) + &#x27;&quot;&gt;수정&lt;/button&gt;&#x27; +
        &#x27;&lt;button class=&quot;ghost&quot; data-del=&quot;&#x27; + esc(it.id) + &#x27;&quot;&gt;삭제&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
    }).join(&#x27;&#x27;);
  }
  function find(id) { return items.filter(function (i) { return i.id === id; })[0]; }

  document.querySelectorAll(&#x27;.tab&#x27;).forEach(function (t) {
    t.onclick = function () {
      document.querySelectorAll(&#x27;.tab&#x27;).forEach(function (x) { x.classList.remove(&#x27;on&#x27;); });
      t.classList.add(&#x27;on&#x27;); filter = t.dataset.f; render();

  });

  var dlg = document.getElementById(&#x27;dlg&#x27;), fCode = document.getElementById(&#x27;fCode&#x27;);
  function openForm(it) {
    editing = it ? it.id : null;
    document.getElementById(&#x27;dTitle&#x27;).textContent = it ? &#x27;수정&#x27; : &#x27;추가&#x27;;
    document.getElementById(&#x27;fCat&#x27;).value = it ? it.c : (filter === &#x27;control&#x27; ? &#x27;control&#x27; : &#x27;optics&#x27;);
    document.getElementById(&#x27;fName&#x27;).value = it ? it.t : &#x27;&#x27;;
    fCode.value = it ? it.code : &#x27;&#x27;;

  }
  document.getElementById(&#x27;btnAdd&#x27;).onclick = function () { openForm(null); };
  document.getElementById(&#x27;fCancel&#x27;).onclick = function () { dlg.close(); };
  fCode.addEventListener(&#x27;keydown&#x27;, function (e) {

    var data = { c: document.getElementById(&#x27;fCat&#x27;).value, t: document.getElementById(&#x27;fName&#x27;).value.trim(), code: code };
    if (editing) { var it = find(editing); if (it) { it.c = data.c; it.t = data.t; it.code = data.code; } }
    else items.unshift({ id: uid(), c: data.c, t: data.t, code: data.code });

  document.getElementById(&#x27;grid&#x27;).addEventListener(&#x27;click&#x27;, function (e) {

      var it = find(c.dataset.copy); if (!it) return;
      var ok = function () { var o = c.textContent; c.textContent = &#x27;복사됨 ✓&#x27;; setTimeout(function () { c.textContent = o; }, 1200); };

  });

  load(); render();
})();

&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;h1&gt;📅 일정&lt;/h1&gt;

  &lt;div class=&quot;form&quot;&gt;
    &lt;input type=&quot;date&quot; id=&quot;fDate&quot;&gt;
    &lt;input type=&quot;text&quot; id=&quot;fTitle&quot; placeholder=&quot;일정 내용&quot; maxlength=&quot;100&quot;&gt;

  &lt;div class=&quot;list&quot; id=&quot;list&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(function () {
  var KEY = &#x27;schedule-v1&#x27;, FLAG = &#x27;schedule-v1-init&#x27;;
  var seed = [
    { id: &#x27;s1&#x27;, date: &#x27;2026-10-31&#x27;, title: &#x27;연구실 청소&#x27; },
    { id: &#x27;s2&#x27;, date: &#x27;2026-10-27&#x27;, title: &#x27;구의역에서 교육이수하기&#x27; },
    { id: &#x27;s3&#x27;, date: &#x27;2026-10-20&#x27;, title: &#x27;500W 테스트&#x27; },
    { id: &#x27;s4&#x27;, date: &#x27;2026-10-15&#x27;, title: &#x27;폐시약통 처리&#x27; }

  var items = [], markerId = null, editId = null, dragging = false;
  var $ = function (id) { return document.getElementById(id); };
  var DAYS = [&#x27;일&#x27;, &#x27;월&#x27;, &#x27;화&#x27;, &#x27;수&#x27;, &#x27;목&#x27;, &#x27;금&#x27;, &#x27;토&#x27;];

  function load() {
    try {
      var raw = localStorage.getItem(KEY);

    } catch (e) { if (!items.length) items = seed.slice(); }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ items: items, markerId: markerId })); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function (c) { return { &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; }[c]; }); }
  function pad(n) { return (n &lt; 10 ? &#x27;0&#x27; : &#x27;&#x27;) + n; }

  function badge(n) {
    if (n === 0) return &#x27;&lt;span class=&quot;diff now&quot;&gt;D-DAY · 오늘&lt;/span&gt;&#x27;;
    if (n &gt; 0) return &#x27;&lt;span class=&quot;diff future&quot;&gt;D-&#x27; + n + &#x27; · &#x27; + n + &#x27;일 뒤&lt;/span&gt;&#x27;;
    return &#x27;&lt;span class=&quot;diff past&quot;&gt;D+&#x27; + (-n) + &#x27; · &#x27; + (-n) + &#x27;일 지남&lt;/span&gt;&#x27;;
  }
  function diffText(n) { return n === 0 ? &#x27;오늘&#x27; : n &gt; 0 ? &#x27;오늘로부터 &#x27; + n + &#x27;일 뒤&#x27; : &#x27;오늘로부터 &#x27; + (-n) + &#x27;일 전&#x27;; }
  function sorted() {

  }

    if (!items.some(function (i) { return i.id === markerId; })) markerId = null;
    var todayIdx = -1;
    list.forEach(function (i, k) { if (i.date &gt;= t) todayIdx = k; });
    var todayLine = &#x27;&lt;div class=&quot;todayline&quot;&gt;&lt;span&gt;오늘 &#x27; + t + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
    var h = &#x27;&#x27;;
    if (!list.length) { $(&#x27;list&#x27;).innerHTML = &#x27;&lt;div class=&quot;empty&quot;&gt;일정이 없어요. 위에서 추가해 보세요.&lt;/div&gt;&#x27;; return; }
    if (todayIdx === -1) h += todayLine;
    if (markerId === null) h += markHtml();
    list.forEach(function (i, k) {
      var n = diff(i.date);
      h += &#x27;&lt;div class=&quot;row &#x27; + (n &lt; 0 ? &#x27;past&#x27; : &#x27;&#x27;) + &#x27;&quot; data-id=&quot;&#x27; + i.id + &#x27;&quot;&gt;&#x27; +
        &#x27;&lt;div class=&quot;date&quot;&gt;날짜 &lt;b&gt;&#x27; + i.date + &#x27;&lt;/b&gt; (&#x27; + dow(i.date) + &#x27;)&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;title&quot;&gt;&#x27; + esc(i.title) + &#x27;&lt;/div&gt;&#x27; + badge(n) +
        &#x27;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;ghost&quot; data-mk=&quot;&#x27; + i.id + &#x27;&quot; title=&quot;분홍 선을 여기로&quot;&gt;📍&lt;/button&gt;&#x27; +
        &#x27;&lt;button class=&quot;ghost&quot; data-ed=&quot;&#x27; + i.id + &#x27;&quot;&gt;✏️&lt;/button&gt;&#x27; +
        &#x27;&lt;button class=&quot;ghost&quot; data-del=&quot;&#x27; + i.id + &#x27;&quot;&gt;🗑️&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
      if (k === todayIdx) h += todayLine;

  function bindDrag() {

  }

  function resetForm() { editId = null; $(&#x27;fTitle&#x27;).value = &#x27;&#x27;; $(&#x27;fOk&#x27;).textContent = &#x27;추가&#x27;; $(&#x27;fCancel&#x27;).style.display = &#x27;none&#x27;; }

&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;
    &lt;h1&gt;👤 인물 카드&lt;/h1&gt;

  &lt;/header&gt;

  &lt;div class=&quot;drop&quot; id=&quot;drop&quot;&gt;
    &lt;strong&gt;이미지를 복사한 뒤 이 페이지에서 Ctrl+V (Mac은 Cmd+V)&lt;/strong&gt;
    &lt;small&gt;붙여넣을 때마다 카드가 한 장씩 추가됩니다. 붙여넣기가 안 되면 페이지의 빈 곳을 한 번 클릭한 뒤 다시 시도하세요.&lt;/small&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid&quot; id=&quot;grid&quot;&gt;&lt;/div&gt;

&lt;script&gt;
(function () {
  var KEY = &#x27;person-cards-v1&#x27;;
  var FIELDS = [
    { k: &#x27;dept&#x27;, label: &#x27;소속&#x27;, ph: &#x27;소속&#x27; },
    { k: &#x27;contact&#x27;, label: &#x27;이메일&#x27;, ph: &#x27;name@example.com&#x27; }
  ];
  var cards = [];
  var saveTimer = null;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      cards = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(cards)) cards = [];
    } catch (e) { cards = []; }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(cards));
      updateMeta();
      return true;
    } catch (e) {
      toast(&#x27;브라우저 저장 공간이 가득 찼습니다. 백업 내보내기 후 오래된 카드를 지워주세요.&#x27;);
      return false;
    }
  }
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }

  function updateMeta() {
    var kb = 0;
    try {
      for (var i = 0; i &lt; localStorage.length; i++) {
        var k = localStorage.key(i);
        kb += k.length + (localStorage.getItem(k) || &#x27;&#x27;).length;
      }
      kb = Math.round(kb / 1024);
    } catch (e) {}
    document.getElementById(&#x27;meta&#x27;).textContent = &#x27;카드 &#x27; + cards.length + &#x27;장 · 모든 탭 합친 저장 용량 약 &#x27; + kb + &#x27;KB / 5,000KB&#x27;;
  }

  function toast(msg) {
    var t = document.getElementById(&#x27;toast&#x27;);
    t.textContent = msg; t.classList.add(&#x27;show&#x27;);
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove(&#x27;show&#x27;); }, 3200);
  }

  function uid() { return &#x27;c&#x27; + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* 이미지 -&gt; 축소한 JPEG data URL */
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function () {
        var img = new Image();
        img.onerror = reject;
        img.onload = function () {
          var max = 640, w = img.width, h = img.height;
          var s = Math.min(1, max / Math.max(w, h));
          var cv = document.createElement(&#x27;canvas&#x27;);
          cv.width = Math.round(w * s); cv.height = Math.round(h * s);
          var ctx = cv.getContext(&#x27;2d&#x27;);
          ctx.fillStyle = &#x27;#fff&#x27;; ctx.fillRect(0, 0, cv.width, cv.height);
          ctx.drawImage(img, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL(&#x27;image/jpeg&#x27;, 0.85));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  document.addEventListener(&#x27;paste&#x27;, function (e) {
    var items = (e.clipboardData &amp;&amp; e.clipboardData.items) || [];
    var files = [];
    for (var i = 0; i &lt; items.length; i++) {
      if (items[i].type.indexOf(&#x27;image/&#x27;) === 0) {
        var f = items[i].getAsFile();
        if (f) files.push(f);
      }
    }
    if (!files.length) return; // 텍스트 붙여넣기는 그대로 둠
    e.preventDefault();
    Promise.all(files.map(shrink)).then(function (imgs) {
      imgs.forEach(function (data) {
        cards.unshift({ id: uid(), img: data, name: &#x27;&#x27;, title: &#x27;&#x27;, dept: &#x27;&#x27;, contact: &#x27;&#x27;, memo: &#x27;&#x27;, papers: [] });
      });
      if (save()) {
        render();
        var d = document.getElementById(&#x27;drop&#x27;);
        d.classList.add(&#x27;flash&#x27;); setTimeout(function () { d.classList.remove(&#x27;flash&#x27;); }, 400);
        var first = document.querySelector(&#x27;.field-name&#x27;);
        if (first) first.focus();
        toast(imgs.length + &#x27;장 추가했습니다. 항목을 입력해 주세요.&#x27;);
      } else {
        cards.splice(0, imgs.length);
      }
    }).catch(function () { toast(&#x27;이미지를 읽지 못했습니다. 캡처 방식으로 다시 복사해 보세요.&#x27;); });
  });

  function bind(el, card, key) {
    el.value = card[key] || &#x27;&#x27;;
    el.addEventListener(&#x27;input&#x27;, function () { card[key] = el.value; saveSoon(); });
  }

  function copyText(txt) {
    if (!txt.trim()) return;
    var done = function () { toast(&#x27;제목을 복사했습니다.&#x27;); };
    var fail = function () { toast(&#x27;복사하지 못했습니다. 제목을 직접 선택해 복사해 주세요.&#x27;); };
    try { navigator.clipboard.writeText(txt).then(done, fail); } catch (e) { fail(); }
  }

  function paperBlock(c) {
    if (!Array.isArray(c.papers)) c.papers = [];
    var box = document.createElement(&#x27;div&#x27;); box.className = &#x27;papers&#x27;;
    var h = document.createElement(&#x27;div&#x27;); h.className = &#x27;papers-h&#x27;; h.textContent = &#x27;이 사람이 푸는 문제&#x27;;
    box.appendChild(h);

    c.papers.forEach(function (p, idx) {

      ta.rows = 2; ta.placeholder = &#x27;논문 제목&#x27;; ta.setAttribute(&#x27;aria-label&#x27;, &#x27;논문 제목&#x27;);
      ta.value = p;
      var fit = function () { ta.style.height = &#x27;auto&#x27;; ta.style.height = (ta.scrollHeight + 2) + &#x27;px&#x27;; };
      ta.addEventListener(&#x27;input&#x27;, function () { c.papers[idx] = ta.value; fit(); saveSoon(); });
      ta.addEventListener(&#x27;paste&#x27;, function (e) {
        var txt = (e.clipboardData &amp;&amp; e.clipboardData.getData(&#x27;text&#x27;)) || &#x27;&#x27;;

        if (lines.length &lt; 2) return;
        e.preventDefault();
        var at = ta.value.trim() ? idx + 1 : idx;
        var del = ta.value.trim() ? 0 : 1;

        save(); render();
        toast(lines.length + &#x27;개 제목으로 나눠 추가했습니다.&#x27;);
      });
      item.appendChild(ta);

      var act = document.createElement(&#x27;div&#x27;); act.className = &#x27;pact&#x27;;
      var bc = document.createElement(&#x27;button&#x27;); bc.type = &#x27;button&#x27;; bc.textContent = &#x27;복사&#x27;;
      bc.addEventListener(&#x27;click&#x27;, function () { copyText(ta.value); });
      var bs = document.createElement(&#x27;button&#x27;); bs.type = &#x27;button&#x27;; bs.textContent = &#x27;검색&#x27;;
      bs.title = &#x27;Google Scholar에서 이 제목 검색&#x27;;
      bs.addEventListener(&#x27;click&#x27;, function () {
        var q = ta.value.trim(); if (!q) return;
        window.open(&#x27;https://scholar.google.com/scholar?q=&#x27; + encodeURIComponent(q), &#x27;_blank&#x27;, &#x27;noopener&#x27;);
      });
      var bd = document.createElement(&#x27;button&#x27;); bd.type = &#x27;button&#x27;; bd.className = &#x27;pdel&#x27;; bd.textContent = &#x27;삭제&#x27;;
      bd.addEventListener(&#x27;click&#x27;, function () { c.papers.splice(idx, 1); save(); render(); });
      act.appendChild(bc); act.appendChild(bs); act.appendChild(bd);
      item.appendChild(act);
      box.appendChild(item);
      setTimeout(fit, 0);
    });

    var add = document.createElement(&#x27;button&#x27;); add.type = &#x27;button&#x27;; add.className = &#x27;padd&#x27;; add.textContent = &#x27;+ 논문 제목 추가&#x27;;
    add.addEventListener(&#x27;click&#x27;, function () {
      c.papers.push(&#x27;&#x27;); save(); render();
      var tas = document.querySelectorAll(&#x27;.card[data-id=&quot;&#x27; + c.id + &#x27;&quot;] .pitem textarea&#x27;);
      if (tas.length) tas[tas.length - 1].focus();
    });
    box.appendChild(add);
    return box;
  }

  function render() {
    var grid = document.getElementById(&#x27;grid&#x27;);
    grid.innerHTML = &#x27;&#x27;;
    if (!cards.length) {
      var em = document.createElement(&#x27;div&#x27;);
      em.className = &#x27;empty&#x27;;
      em.textContent = &#x27;아직 카드가 없습니다. 이미지를 복사해서 붙여넣어 보세요.&#x27;;
      grid.appendChild(em);
    }
    cards.forEach(function (c) {
      var el = document.createElement(&#x27;div&#x27;); el.className = &#x27;card&#x27;; el.setAttribute(&#x27;data-id&#x27;, c.id);

      var del = document.createElement(&#x27;button&#x27;);
      del.className = &#x27;del&#x27;; del.type = &#x27;button&#x27;; del.textContent = &#x27;×&#x27;; del.title = &#x27;카드 삭제&#x27;; del.setAttribute(&#x27;aria-label&#x27;, &#x27;카드 삭제&#x27;);
      del.addEventListener(&#x27;click&#x27;, function () {
        if (!confirm(&#x27;이 카드를 삭제할까요?&#x27;)) return;
        cards = cards.filter(function (x) { return x.id !== c.id; });
        save(); render();
      });
      el.appendChild(del);

      var ph = document.createElement(&#x27;div&#x27;); ph.className = &#x27;photo&#x27;;
      var im = document.createElement(&#x27;img&#x27;); im.src = c.img; im.alt = c.name || &#x27;인물 사진&#x27;;
      ph.appendChild(im); el.appendChild(ph);

      var n = document.createElement(&#x27;input&#x27;);
      n.className = &#x27;field-name&#x27;; n.placeholder = &#x27;이름&#x27;; n.setAttribute(&#x27;aria-label&#x27;, &#x27;이름&#x27;);
      bind(n, c, &#x27;name&#x27;); el.appendChild(n);

      var t = document.createElement(&#x27;input&#x27;);
      t.className = &#x27;field-title&#x27;; t.placeholder = &#x27;직위&#x27;; t.setAttribute(&#x27;aria-label&#x27;, &#x27;직위&#x27;);
      bind(t, c, &#x27;title&#x27;); el.appendChild(t);

      var rows = document.createElement(&#x27;div&#x27;); rows.className = &#x27;rows&#x27;;
      FIELDS.forEach(function (f) {
        var r = document.createElement(&#x27;div&#x27;); r.className = &#x27;row&#x27;;
        var l = document.createElement(&#x27;label&#x27;); l.textContent = f.label;
        var i = document.createElement(&#x27;input&#x27;); i.placeholder = f.ph; i.setAttribute(&#x27;aria-label&#x27;, f.label);
        bind(i, c, f.k);
        r.appendChild(l); r.appendChild(i); rows.appendChild(r);
      });
      var mr = document.createElement(&#x27;div&#x27;); mr.className = &#x27;row memo&#x27;;
      var ml = document.createElement(&#x27;label&#x27;); ml.textContent = &#x27;메모&#x27;;
      var mt = document.createElement(&#x27;textarea&#x27;); mt.rows = 2; mt.placeholder = &#x27;메모&#x27;; mt.setAttribute(&#x27;aria-label&#x27;, &#x27;메모&#x27;);
      bind(mt, c, &#x27;memo&#x27;);
      mr.appendChild(ml); mr.appendChild(mt); rows.appendChild(mr);
      el.appendChild(rows);
      el.appendChild(paperBlock(c));

      grid.appendChild(el);
    });
    updateMeta();
  }

  /* 백업 */
  document.getElementById(&#x27;btnExport&#x27;).addEventListener(&#x27;click&#x27;, function () {
    var blob = new Blob([JSON.stringify(cards)], { type: &#x27;application/json&#x27; });
    var a = document.createElement(&#x27;a&#x27;);
    a.href = URL.createObjectURL(blob);
    a.download = &#x27;person_cards_backup.json&#x27;;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  document.getElementById(&#x27;btnImport&#x27;).addEventListener(&#x27;click&#x27;, function () {
    document.getElementById(&#x27;fileImport&#x27;).click();
  });
  document.getElementById(&#x27;fileImport&#x27;).addEventListener(&#x27;change&#x27;, function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var data = JSON.parse(r.result);
        if (!Array.isArray(data)) throw new Error(&#x27;bad&#x27;);
        var have = {}; cards.forEach(function (c) { have[c.id] = true; });
        var added = 0;
        data.forEach(function (c) {
          if (c &amp;&amp; c.img &amp;&amp; !have[c.id]) { cards.push(c); added++; }
        });
        save(); render();
        toast(added + &#x27;장을 불러왔습니다.&#x27;);
      } catch (err) { toast(&#x27;백업 파일을 읽지 못했습니다.&#x27;); }
    };
    r.readAsText(f);
    e.target.value = &#x27;&#x27;;
  });

  load();
  render();
})();
&lt;/script&gt;

&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;h1&gt;💡 Tip / 힌트&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;들은 팁과 힌트를 출처人과 함께 짧게 적어둬요.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;add&quot;&gt;
      &lt;input id=&quot;aWho&quot; type=&quot;text&quot; list=&quot;whoList&quot; placeholder=&quot;출처人&quot; maxlength=&quot;30&quot;&gt;
      &lt;textarea id=&quot;aTxt&quot; rows=&quot;1&quot; placeholder=&quot;내용 (Ctrl/⌘+Enter로 추가)&quot;&gt;&lt;/textarea&gt;
      &lt;button class=&quot;act&quot; id=&quot;aBtn&quot;&gt;＋ 추가&lt;/button&gt;
    &lt;/div&gt;
    &lt;datalist id=&quot;whoList&quot;&gt;&lt;/datalist&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;chips&quot; id=&quot;chips&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;list&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(function () {
  var KEY = &#x27;tips-v1&#x27;;
  var items = load();
  var filter = &#x27;all&#x27;;
  var editing = null;
  var $ = function (id) { return document.getElementById(id); };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var o = JSON.parse(raw); if (o &amp;&amp; Array.isArray(o.items)) return o.items; }
    } catch (e) {}
    return [];
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ items: items })); } catch (e) {} }
  function esc(s) { return String(s == null ? &#x27;&#x27; : s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function (c) { return { &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; }[c]; }); }
  function uid() { return &#x27;t&#x27; + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function whos() {
    var seen = {}, out = [];
    items.forEach(function (x) { var w = (x.who || &#x27;&#x27;).trim(); if (w &amp;&amp; !seen[w]) { seen[w] = 1; out.push(w); } });
    return out;
  }

  function render() {
    var ws = whos();
    if (filter !== &#x27;all&#x27; &amp;&amp; filter !== &#x27;__none&#x27; &amp;&amp; ws.indexOf(filter) &lt; 0) filter = &#x27;all&#x27;;
    $(&#x27;whoList&#x27;).innerHTML = ws.map(function (w) { return &#x27;&lt;option value=&quot;&#x27; + esc(w) + &#x27;&quot;&gt;&#x27;; }).join(&#x27;&#x27;);
    var ch = &#x27;&lt;button class=&quot;tab&#x27; + (filter === &#x27;all&#x27; ? &#x27; on&#x27; : &#x27;&#x27;) + &#x27;&quot; data-f=&quot;all&quot;&gt;전체 &#x27; + items.length + &#x27;&lt;/button&gt;&#x27;;
    ws.forEach(function (w) {
      var n = items.filter(function (x) { return (x.who || &#x27;&#x27;).trim() === w; }).length;
      ch += &#x27;&lt;button class=&quot;tab&#x27; + (filter === w ? &#x27; on&#x27; : &#x27;&#x27;) + &#x27;&quot; data-f=&quot;&#x27; + esc(w) + &#x27;&quot;&gt;&#x27; + esc(w) + &#x27; &#x27; + n + &#x27;&lt;/button&gt;&#x27;;
    });
    $(&#x27;chips&#x27;).innerHTML = ch;

    var shown = items.filter(function (x) {
      var w = (x.who || &#x27;&#x27;).trim();
      return filter === &#x27;all&#x27; || w === filter;
    });
    if (!shown.length) { $(&#x27;list&#x27;).innerHTML = &#x27;&lt;div class=&quot;empty&quot;&gt;&#x27; + (items.length ? &#x27;해당 출처人의 팁이 없어요.&#x27; : &#x27;아직 팁이 없어요. 위에서 첫 팁을 추가해보세요.&#x27;) + &#x27;&lt;/div&gt;&#x27;; return; }
    $(&#x27;list&#x27;).innerHTML = shown.map(function (x) {
      if (editing === x.id) {
        return &#x27;&lt;div class=&quot;erow&quot; data-id=&quot;&#x27; + x.id + &#x27;&quot;&gt;&#x27; +
          &#x27;&lt;input class=&quot;eWho&quot; list=&quot;whoList&quot; maxlength=&quot;30&quot; value=&quot;&#x27; + esc(x.who) + &#x27;&quot; placeholder=&quot;출처人&quot;&gt;&#x27; +
          &#x27;&lt;textarea class=&quot;eTxt&quot; rows=&quot;2&quot;&gt;&#x27; + esc(x.text) + &#x27;&lt;/textarea&gt;&#x27; +
          &#x27;&lt;div class=&quot;acts&quot; style=&quot;opacity:1&quot;&gt;&lt;button class=&quot;ghost&quot; data-a=&quot;ok&quot;&gt;저장&lt;/button&gt;&lt;button class=&quot;ghost&quot; data-a=&quot;cancel&quot;&gt;취소&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
      }
      var w = (x.who || &#x27;&#x27;).trim();
      return &#x27;&lt;div class=&quot;row&quot; data-id=&quot;&#x27; + x.id + &#x27;&quot;&gt;&#x27; +
        &#x27;&lt;span class=&quot;who&#x27; + (w ? &#x27;&#x27; : &#x27; none&#x27;) + &#x27;&quot;&gt;&#x27; + (w ? esc(w) : &#x27;—&#x27;) + &#x27;&lt;/span&gt;&#x27; +
        &#x27;&lt;div class=&quot;txt&quot;&gt;&#x27; + esc(x.text) + &#x27;&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;ghost&quot; data-a=&quot;edit&quot;&gt;수정&lt;/button&gt;&lt;button class=&quot;ghost del&quot; data-a=&quot;del&quot;&gt;삭제&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
    }).join(&#x27;&#x27;);
  }

  function add() {
    var t = $(&#x27;aTxt&#x27;).value.trim();
    if (!t) { $(&#x27;aTxt&#x27;).focus(); return; }
    items.unshift({ id: uid(), who: $(&#x27;aWho&#x27;).value.trim(), text: t, t: Date.now() });
    save();
    $(&#x27;aTxt&#x27;).value = &#x27;&#x27;;
    $(&#x27;aTxt&#x27;).focus();
    render();
  }
  $(&#x27;aBtn&#x27;).addEventListener(&#x27;click&#x27;, add);
  $(&#x27;aTxt&#x27;).addEventListener(&#x27;keydown&#x27;, function (e) { if (e.key === &#x27;Enter&#x27; &amp;&amp; (e.ctrlKey || e.metaKey)) { e.preventDefault(); add(); } });
  $(&#x27;aWho&#x27;).addEventListener(&#x27;keydown&#x27;, function (e) { if (e.key === &#x27;Enter&#x27;) { e.preventDefault(); $(&#x27;aTxt&#x27;).focus(); } });

  $(&#x27;chips&#x27;).addEventListener(&#x27;click&#x27;, function (e) {
    var b = e.target.closest(&#x27;.tab&#x27;); if (!b) return;
    filter = b.getAttribute(&#x27;data-f&#x27;); render();
  });
  $(&#x27;list&#x27;).addEventListener(&#x27;click&#x27;, function (e) {
    var b = e.target.closest(&#x27;button[data-a]&#x27;); if (!b) return;
    var row = b.closest(&#x27;[data-id]&#x27;); var id = row.getAttribute(&#x27;data-id&#x27;);
    var a = b.getAttribute(&#x27;data-a&#x27;);
    var i = items.findIndex(function (x) { return x.id === id; });
    if (i &lt; 0) return;
    if (a === &#x27;edit&#x27;) { editing = id; render(); var el = document.querySelector(&#x27;.eTxt&#x27;); if (el) el.focus(); }
    else if (a === &#x27;cancel&#x27;) { editing = null; render(); }
    else if (a === &#x27;ok&#x27;) {
      var t = row.querySelector(&#x27;.eTxt&#x27;).value.trim();
      if (!t) { row.querySelector(&#x27;.eTxt&#x27;).focus(); return; }
      items[i].who = row.querySelector(&#x27;.eWho&#x27;).value.trim();
      items[i].text = t;
      editing = null; save(); render();
    }
    else if (a === &#x27;del&#x27;) {
      if (!confirm(&#x27;이 팁을 삭제할까요?&#x27;)) return;
      items.splice(i, 1); save(); render();
    }
  });

  render();
})();
&lt;/script&gt;
&lt;/body&gt;

&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;

  &lt;p class=&quot;sub&quot;&gt;모든 탭의 데이터를 JSON 파일 하나로 내보내고, 다시 불러와요.&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;현재 저장된 데이터&lt;/h2&gt;

&lt;script&gt;
(function () {
  var APP = &#x27;Graph_Employe_Mate&#x27;;
  var KEYS = [
    [&#x27;graph-archive-v1&#x27;, &#x27;📈 그래프 아카이브&#x27;],
    [&#x27;employee-mate-v1&#x27;, &#x27;⚙️ 업무 엔진&#x27;],
    [&#x27;matlab-fn-v2&#x27;, &#x27;🧮 MATLAB 함수&#x27;],
    [&#x27;matlab-fn-v2-init&#x27;, null],
    [&#x27;schedule-v1&#x27;, &#x27;📅 일정&#x27;],
    [&#x27;schedule-v1-init&#x27;, null],
    [&#x27;menubook-v1&#x27;, &#x27;📖 제작 메뉴북&#x27;],
    [&#x27;sales-v1&#x27;, &#x27;💼 영업&#x27;],
    [&#x27;sales-v1-init&#x27;, null],
    [&#x27;person-cards-v1&#x27;, &#x27;👤 인물 카드&#x27;],
    [&#x27;tips-v1&#x27;, &#x27;💡 Tip / 힌트&#x27;],
    [&#x27;my-focus-v1&#x27;, &#x27;🎯 나의 방향&#x27;]
  ];
  var $ = function (id) { return document.getElementById(id); };
  function say(t, err) { $(&#x27;msg&#x27;).textContent = t; $(&#x27;msg&#x27;).className = err ? &#x27;err&#x27; : &#x27;&#x27;; }
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function count(k) {
    var raw = get(k); if (raw === null) return &#x27;없음&#x27;;
    try {
      var o = JSON.parse(raw);
      var a = Array.isArray(o) ? o : (o &amp;&amp; Array.isArray(o.items) ? o.items : null);
      return a ? a.length + &#x27;개&#x27; : &#x27;있음&#x27;;
    } catch (e) { return &#x27;있음&#x27;; }
  }
  function renderTbl() {
    var h = &#x27;&#x27;;
    KEYS.forEach(function (p) { if (p[1]) h += &#x27;&lt;tr&gt;&lt;td&gt;&#x27; + p[1] + &#x27;&lt;/td&gt;&lt;td&gt;&#x27; + count(p[0]) + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;; });
    $(&#x27;tbl&#x27;).innerHTML = h;
  }

  $(&#x27;bExp&#x27;).addEventListener(&#x27;click&#x27;, function () {
    var data = {};
    KEYS.forEach(function (p) {
      var raw = get(p[0]); if (raw === null) return;
      try { data[p[0]] = JSON.parse(raw); } catch (e) { data[p[0]] = raw; }
    });
    var out = { app: APP, version: 1, exported: new Date().toISOString(), data: data };
    var blob = new Blob([JSON.stringify(out, null, 2)], { type: &#x27;application/json&#x27; });
    var d = new Date(), pad = function (n) { return (n &lt; 10 ? &#x27;0&#x27; : &#x27;&#x27;) + n; };
    var name = APP + &#x27;_&#x27; + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + &#x27;.json&#x27;;
    var a = document.createElement(&#x27;a&#x27;);
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    say(&#x27;내보냈어요: &#x27; + name);
  });

  $(&#x27;bImp&#x27;).addEventListener(&#x27;click&#x27;, function () { $(&#x27;file&#x27;).value = &#x27;&#x27;; $(&#x27;file&#x27;).click(); });
  $(&#x27;file&#x27;).addEventListener(&#x27;change&#x27;, function () {
    var f = $(&#x27;file&#x27;).files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var o;
      try { o = JSON.parse(r.result); } catch (e) { say(&#x27;JSON 형식이 아니에요.&#x27;, true); return; }
      if (!o || o.app !== APP || !o.data || typeof o.data !== &#x27;object&#x27;) { say(&#x27;이 앱에서 내보낸 파일이 아니에요.&#x27;, true); return; }
      var ks = KEYS.map(function (p) { return p[0]; }).filter(function (k) { return k in o.data; });
      if (!ks.length) { say(&#x27;불러올 데이터가 없어요.&#x27;, true); return; }
      if (!confirm(&#x27;파일의 데이터로 현재 데이터를 덮어쓸까요? (&#x27; + ks.length + &#x27;개 항목)&#x27;)) return;
      try {
        ks.forEach(function (k) { localStorage.setItem(k, JSON.stringify(o.data[k])); });
      } catch (e) { say(&#x27;저장에 실패했어요.&#x27;, true); return; }
      renderTbl();
      try {
        var self = window.frameElement;
        parent.document.querySelectorAll(&#x27;iframe.pane&#x27;).forEach(function (fr) {
          if (fr === self) return;
          var s = fr.srcdoc; fr.srcdoc = &#x27;&#x27;; fr.srcdoc = s;
        });
        say(&#x27;불러왔어요. 다른 탭에 바로 반영됐어요.&#x27;);
      } catch (e) { say(&#x27;불러왔어요. 페이지를 새로고침하면 반영돼요.&#x27;); }
    };
    r.readAsText(f);
  });

  renderTbl();
})();
&lt;/script&gt;

<script>
(function () {

  function makeInput(chip, initial, commit) {
    var inp = document.createElement('input');
    inp.type = 'text'; inp.value = initial; inp.maxLength = 60;
    inp.style.width = Math.max(8, initial.length * 1.3 + 2) + 'ch';
    var done = false;
    function finish(ok) {
      if (done) return; done = true;
      commit(ok ? inp.value.trim() : null);
    }
    inp.addEventListener('input', function () { inp.style.width = Math.max(8, inp.value.length * 1.3 + 2) + 'ch'; });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { finish(false); }
    });
    inp.addEventListener('blur', function () { finish(true); });
    chip.classList.add('editing');
    return inp;
  }

  function render() {
    list.textContent = '';
    items.forEach(function (t, i) {
      var chip = document.createElement('span'); chip.className = 'fchip';
      var ft = document.createElement('span'); ft.className = 'ft'; ft.textContent = t; ft.title = '클릭해서 수정';
      var fx = document.createElement('button'); fx.className = 'fx'; fx.textContent = '×'; fx.title = '삭제';
      fx.addEventListener('click', function () { items.splice(i, 1); save(); render(); });
      ft.addEventListener('click', function () {
        chip.textContent = '';
        var inp = makeInput(chip, t, function (v) {
          if (v === null) { render(); return; }
          if (v === '') items.splice(i, 1); else items[i] = v;
          save(); render();
        });
        chip.appendChild(inp); inp.focus(); inp.select();
      });
      chip.appendChild(ft); chip.appendChild(fx); list.appendChild(chip);
    });

    var add = document.createElement('button'); add.className = 'fadd'; add.textContent = '+ 추가';
    add.addEventListener('click', function () {
      var chip = document.createElement('span'); chip.className = 'fchip';
      var inp = makeInput(chip, '', function (v) {
        if (v) { items.push(v); save(); }
        render();
        if (v) { var b = list.querySelector('.fadd'); if (b) b.focus(); }
      });
      inp.placeholder = '지금 하는 일';
      chip.appendChild(inp);
      list.replaceChild(chip, add); inp.focus();
    });
    list.appendChild(add);

    if (!items.length) {
      var em = document.createElement('span'); em.className = 'fempty';
      em.textContent = '지금 집중하는 일을 적어두세요';
      list.insertBefore(em, add);
    }
  }

  document.getElementById('focusCopy').addEventListener('click', function () {
    var btn = this;
    if (!items.length) return;
    var text = '지금 제가 집중하고 있는 일: ' + items.join(' / ');
    function ok() { var o = btn.textContent; btn.textContent = '✓ 복사됨 · 붙여넣어 전달하세요'; setTimeout(function () { btn.textContent = o; }, 2200); }
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) {}
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  });

  if (localStorage.getItem(KEY) === null) save();
  render();
})();
</script>
</body>
</html>
