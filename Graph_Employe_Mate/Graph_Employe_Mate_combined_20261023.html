&lt;style&gt;
  :root {

&lt;/style&gt;

&lt;div class=&quot;wrap&quot;&gt;

  &lt;/div&gt;

    &lt;button class=&quot;tab&quot; data-f=&quot;sim&quot;&gt;🟢 시뮬&lt;/button&gt;
    &lt;button class=&quot;tab&quot; data-f=&quot;exp&quot;&gt;🌿 실험&lt;/button&gt;

        &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;type&quot; value=&quot;sim&quot;&gt;&lt;span class=&quot;sim&quot;&gt;🟢 내 시뮬&lt;/span&gt;&lt;/label&gt;
        &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;type&quot; value=&quot;exp&quot;&gt;&lt;span class=&quot;exp&quot;&gt;🌿 내 실험&lt;/span&gt;&lt;/label&gt;
      &lt;/div&gt;

    &lt;div&gt;&lt;label&gt;제목&lt;/label&gt;&lt;input type=&quot;text&quot; id=&quot;fTitle&quot; placeholder=&quot;예: ARF 벽두께에 따른 transmission&quot;&gt;&lt;/div&gt;
    &lt;div&gt;&lt;label&gt;이미지 파일&lt;/label&gt;&lt;input type=&quot;file&quot; id=&quot;fFile&quot; accept=&quot;image/*&quot;&gt;&lt;/div&gt;

    &lt;div&gt;&lt;label&gt;메모 (무엇을 보여주는 그래프인지 / 논문 어느 Figure 후보인지)&lt;/label&gt;&lt;textarea id=&quot;fMemo&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
    &lt;div&gt;&lt;label&gt;출처 링크 (관심 그래프는 논문 링크 등, 선택)&lt;/label&gt;&lt;input type=&quot;url&quot; id=&quot;fSrc&quot; placeholder=&quot;https://...&quot;&gt;&lt;/div&gt;

      &lt;button class=&quot;ghost&quot; id=&quot;fCancel&quot;&gt;취소&lt;/button&gt;

&lt;dialog id=&quot;viewer&quot;&gt;&lt;img id=&quot;viewImg&quot; alt=&quot;&quot;&gt;&lt;div class=&quot;row&quot;&gt;&lt;button class=&quot;ghost&quot; id=&quot;viewClose&quot;&gt;닫기&lt;/button&gt;&lt;/div&gt;&lt;/dialog&gt;

&lt;script&gt;
(function () {
  var KEY = &#x27;graph-archive-v1&#x27;;
  var LABEL = { interest: &#x27;관심&#x27;, sim: &#x27;내 시뮬&#x27;, exp: &#x27;내 실험&#x27; };
  var items = [], filter = &#x27;all&#x27;, goal = 10;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var d = JSON.parse(raw); items = d.items || []; goal = d.goal || 10; }
    } catch (e) { items = []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ items: items, goal: goal })); }
    catch (e) { alert(&#x27;저장 공간이 부족해요. 내보내기로 백업하거나 이미지 대신 URL을 써 보세요.&#x27;); }
  }
  function esc(s) { return String(s || &#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function (c) { return { &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || &#x27;&#x27;) ? u : &#x27;&#x27;; }
  function safeImg(u) { return /^(https?:\/\/|data:image\/)/i.test(u || &#x27;&#x27;) ? u : &#x27;&#x27;; }

  function render() {
    var n = { interest: 0, sim: 0, exp: 0 };
    items.forEach(function (i) { n[i.type]++; });
    document.getElementById(&#x27;sAll&#x27;).textContent = items.length;
    document.getElementById(&#x27;sInt&#x27;).textContent = n.interest;
    document.getElementById(&#x27;sSim&#x27;).textContent = n.sim;
    document.getElementById(&#x27;sExp&#x27;).textContent = n.exp;
    var mine = n.sim + n.exp;
    document.getElementById(&#x27;goalCur&#x27;).textContent = mine;
    document.getElementById(&#x27;goalN&#x27;).value = goal;
    document.getElementById(&#x27;goalBar&#x27;).style.width = Math.min(100, mine / goal * 100) + &#x27;%&#x27;;

    var list = items.filter(function (i) { return filter === &#x27;all&#x27; || i.type === filter; });
    var g = document.getElementById(&#x27;grid&#x27;);
    if (!list.length) { g.innerHTML = &#x27;&lt;div class=&quot;emptymsg&quot;&gt;아직 없어요. 첫 그래프를 추가해 보세요.&lt;/div&gt;&#x27;; return; }
    g.innerHTML = list.map(function (i) {
      var img = safeImg(i.img), src = safeUrl(i.src);
      return &#x27;&lt;div class=&quot;frame &#x27; + i.type + &#x27;&quot;&gt;&lt;div class=&quot;card&quot;&gt;&#x27; +
        (img ? &#x27;&lt;div class=&quot;thumb&quot; data-view=&quot;&#x27; + i.id + &#x27;&quot;&gt;&lt;img src=&quot;&#x27; + esc(img) + &#x27;&quot; alt=&quot;&quot;&gt;&lt;/div&gt;&#x27; : &#x27;&lt;div class=&quot;thumb empty&quot;&gt;이미지 없음&lt;/div&gt;&#x27;) +
        &#x27;&lt;div class=&quot;info&quot;&gt;&lt;select class=&quot;badge &#x27; + i.type + &#x27;&quot; data-type=&quot;&#x27; + i.id + &#x27;&quot; title=&quot;분류 변경&quot;&gt;&#x27; + [&#x27;interest&#x27;, &#x27;sim&#x27;, &#x27;exp&#x27;].map(function (t) { return &#x27;&lt;option value=&quot;&#x27; + t + &#x27;&quot;&#x27; + (t === i.type ? &#x27; selected&#x27; : &#x27;&#x27;) + &#x27;&gt;&#x27; + LABEL[t] + &#x27;&lt;/option&gt;&#x27;; }).join(&#x27;&#x27;) + &#x27;&lt;/select&gt;&#x27; +
        &#x27;&lt;div class=&quot;title&quot; data-tid=&quot;&#x27; + i.id + &#x27;&quot; title=&quot;클릭해서 제목 수정&quot;&gt;&#x27; + esc(i.title || &#x27;(제목 없음)&#x27;) + &#x27;&lt;/div&gt;&#x27; +
        (i.memo ? &#x27;&lt;div class=&quot;memo&quot;&gt;&#x27; + esc(i.memo) + &#x27;&lt;/div&gt;&#x27; : &#x27;&#x27;) +
        &#x27;&lt;div class=&quot;meta&quot;&gt;&lt;span&gt;&#x27; + esc(i.date) + (src ? &#x27; · &lt;a href=&quot;&#x27; + esc(src) + &#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;출처&lt;/a&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/span&gt;&#x27; +
        &#x27;&lt;span&gt;&lt;button class=&quot;edit&quot; data-edit=&quot;&#x27; + i.id + &#x27;&quot;&gt;제목 수정&lt;/button&gt;&lt;button class=&quot;del&quot; data-del=&quot;&#x27; + i.id + &#x27;&quot;&gt;삭제&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
    }).join(&#x27;&#x27;);
  }

  function resize(file, cb) {
    var r = new FileReader();
    r.onload = function () {
      var im = new Image();
      im.onload = function () {
        var max = 900, s = Math.min(1, max / Math.max(im.width, im.height));
        var c = document.createElement(&#x27;canvas&#x27;);
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        var x = c.getContext(&#x27;2d&#x27;); x.fillStyle = &#x27;#fff&#x27;; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(im, 0, 0, c.width, c.height);
        cb(c.toDataURL(&#x27;image/jpeg&#x27;, 0.85));
      };
      im.onerror = function () { cb(&#x27;&#x27;); };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  }

  var dlg = document.getElementById(&#x27;dlg&#x27;);
  document.getElementById(&#x27;btnAdd&#x27;).onclick = function () {
    [&#x27;fTitle&#x27;, &#x27;fUrl&#x27;, &#x27;fMemo&#x27;, &#x27;fSrc&#x27;].forEach(function (id) { document.getElementById(id).value = &#x27;&#x27;; });
    document.getElementById(&#x27;fFile&#x27;).value = &#x27;&#x27;;
    dlg.showModal();
  };
  document.getElementById(&#x27;fCancel&#x27;).onclick = function () { dlg.close(); };
  document.getElementById(&#x27;fSave&#x27;).onclick = function () {
    var type = document.querySelector(&#x27;input[name=type]:checked&#x27;).value;
    var base = {
      id: Date.now() + &#x27;&#x27; + Math.floor(Math.random() * 1000), type: type,
      title: document.getElementById(&#x27;fTitle&#x27;).value.trim(),
      memo: document.getElementById(&#x27;fMemo&#x27;).value.trim(),
      src: document.getElementById(&#x27;fSrc&#x27;).value.trim(),
      date: new Date().toISOString().slice(0, 10), img: &#x27;&#x27;
    };
    var f = document.getElementById(&#x27;fFile&#x27;).files[0];
    var url = document.getElementById(&#x27;fUrl&#x27;).value.trim();
    function done(img) { base.img = img; items.unshift(base); save(); render(); dlg.close(); }
    if (f) resize(f, done); else done(url);
  };

  function startEdit(id) {
    var el = document.querySelector(&#x27;[data-tid=&quot;&#x27; + id + &#x27;&quot;]&#x27;);
    var it = items.filter(function (i) { return i.id === id; })[0];
    if (!el || !it) return;
    var inp = document.createElement(&#x27;input&#x27;);
    inp.type = &#x27;text&#x27;; inp.className = &#x27;titleinput&#x27;; inp.value = it.title || &#x27;&#x27;;
    el.replaceWith(inp); inp.focus(); inp.select();
    var finished = false;
    function finish(ok) {
      if (finished) return; finished = true;
      if (ok) { it.title = inp.value.trim(); save(); }
      render();
    }
    inp.addEventListener(&#x27;keydown&#x27;, function (ev) {
      if (ev.key === &#x27;Enter&#x27;) finish(true);
      else if (ev.key === &#x27;Escape&#x27;) finish(false);
    });
    inp.addEventListener(&#x27;blur&#x27;, function () { finish(true); });
  }

  document.getElementById(&#x27;grid&#x27;).addEventListener(&#x27;click&#x27;, function (e) {
    var ed = e.target.closest(&#x27;[data-edit],[data-tid]&#x27;);
    if (ed) { startEdit(ed.dataset.edit || ed.dataset.tid); return; }
    var d = e.target.closest(&#x27;[data-del]&#x27;);
    if (d) {
      if (confirm(&#x27;이 그래프를 삭제할까요?&#x27;)) { items = items.filter(function (i) { return i.id !== d.dataset.del; }); save(); render(); }
      return;
    }
    var v = e.target.closest(&#x27;[data-view]&#x27;);
    if (v) {
      var it = items.filter(function (i) { return i.id === v.dataset.view; })[0];
      if (it) { document.getElementById(&#x27;viewImg&#x27;).src = safeImg(it.img); document.getElementById(&#x27;viewer&#x27;).showModal(); }
    }
  });
  document.getElementById(&#x27;viewClose&#x27;).onclick = function () { document.getElementById(&#x27;viewer&#x27;).close(); };

  document.querySelectorAll(&#x27;.tab&#x27;).forEach(function (t) {
    t.onclick = function () {
      document.querySelectorAll(&#x27;.tab&#x27;).forEach(function (x) { x.classList.remove(&#x27;on&#x27;); });
      t.classList.add(&#x27;on&#x27;); filter = t.dataset.f; render();
    };
  });
  document.getElementById(&#x27;goalN&#x27;).onchange = function (e) { goal = Math.max(1, parseInt(e.target.value, 10) || 10); save(); render(); };

  document.getElementById(&#x27;grid&#x27;).addEventListener(&#x27;change&#x27;, function (e) {
    var s = e.target.closest(&#x27;[data-type]&#x27;);
    if (!s) return;
    var it = items.filter(function (i) { return i.id === s.dataset.type; })[0];
    if (it &amp;&amp; LABEL[s.value]) { it.type = s.value; save(); render(); }
  });

  document.getElementById(&#x27;btnExport&#x27;).onclick = function () {
    var blob = new Blob([JSON.stringify({ items: items, goal: goal })], { type: &#x27;application/json&#x27; });
    var a = document.createElement(&#x27;a&#x27;); a.href = URL.createObjectURL(blob); a.download = &#x27;graph-archive.json&#x27;; a.click();
  };
  document.getElementById(&#x27;btnImport&#x27;).onclick = function () { document.getElementById(&#x27;importFile&#x27;).click(); };
  document.getElementById(&#x27;importFile&#x27;).onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try { var d = JSON.parse(r.result); items = d.items || []; goal = d.goal || 10; save(); render(); }
      catch (err) { alert(&#x27;파일을 읽을 수 없어요.&#x27;); }
    };
    r.readAsText(f);
  };

  load(); render();
})();

&lt;script&gt;
(function () {
  var KEY = &#x27;employee-mate-v1&#x27;;
  var LABEL = { req: &#x27;요청 받은 일&#x27;, done: &#x27;완료&#x27;, todo: &#x27;해야될 것 같은 일&#x27;, free: &#x27;자유 주제&#x27; };
  var TYPES = [&#x27;req&#x27;, &#x27;done&#x27;, &#x27;todo&#x27;, &#x27;free&#x27;];
  // 이전 3분류(관심/내 시뮬/내 실험) 데이터를 새 4분류로 변환
  var LEGACY = { interest: &#x27;free&#x27;, sim: &#x27;done&#x27;, exp: &#x27;done&#x27; };
  function migrate(list) {
    return (list || []).map(function (i) {
      if (!LABEL[i.type]) i.type = LEGACY[i.type] || &#x27;free&#x27;;
      return i;
    });
  }
  var items = [], filter = &#x27;all&#x27;, goal = 10;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var d = JSON.parse(raw); items = migrate(d.items); goal = d.goal || 10; }
    } catch (e) { items = []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ items: items, goal: goal })); }
    catch (e) { alert(&#x27;저장 공간이 부족해요. 내보내기로 백업하거나 이미지 대신 URL을 써 보세요.&#x27;); }
  }
  function esc(s) { return String(s || &#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function (c) { return { &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || &#x27;&#x27;) ? u : &#x27;&#x27;; }
  function safeImg(u) { return /^(https?:\/\/|data:image\/)/i.test(u || &#x27;&#x27;) ? u : &#x27;&#x27;; }

  function render() {
    var n = { req: 0, done: 0, todo: 0, free: 0 };
    items.forEach(function (i) { n[i.type]++; });
    document.getElementById(&#x27;sAll&#x27;).textContent = items.length;
    document.getElementById(&#x27;sReq&#x27;).textContent = n.req;
    document.getElementById(&#x27;sDone&#x27;).textContent = n.done;
    document.getElementById(&#x27;sTodo&#x27;).textContent = n.todo;
    document.getElementById(&#x27;sFree&#x27;).textContent = n.free;
    var mine = n.done;
    document.getElementById(&#x27;goalCur&#x27;).textContent = mine;
    document.getElementById(&#x27;goalN&#x27;).value = goal;
    document.getElementById(&#x27;goalBar&#x27;).style.width = Math.min(100, mine / goal * 100) + &#x27;%&#x27;;

    var list = items.filter(function (i) { return filter === &#x27;all&#x27; || i.type === filter; });
    var g = document.getElementById(&#x27;grid&#x27;);
    if (!list.length) { g.innerHTML = &#x27;&lt;div class=&quot;emptymsg&quot;&gt;아직 없어요. 첫 이미지를 추가해 보세요.&lt;/div&gt;&#x27;; return; }
    g.innerHTML = list.map(function (i) {
      var img = safeImg(i.img), src = safeUrl(i.src);
      return &#x27;&lt;div class=&quot;frame &#x27; + i.type + &#x27;&quot;&gt;&lt;div class=&quot;card&quot;&gt;&#x27; +
        (img ? &#x27;&lt;div class=&quot;thumb&quot; data-view=&quot;&#x27; + i.id + &#x27;&quot;&gt;&lt;img src=&quot;&#x27; + esc(img) + &#x27;&quot; alt=&quot;&quot;&gt;&lt;/div&gt;&#x27; : &#x27;&lt;div class=&quot;thumb empty&quot;&gt;이미지 없음&lt;/div&gt;&#x27;) +
        &#x27;&lt;div class=&quot;info&quot;&gt;&lt;select class=&quot;badge &#x27; + i.type + &#x27;&quot; data-type=&quot;&#x27; + i.id + &#x27;&quot; title=&quot;분류 변경&quot;&gt;&#x27; + TYPES.map(function (t) { return &#x27;&lt;option value=&quot;&#x27; + t + &#x27;&quot;&#x27; + (t === i.type ? &#x27; selected&#x27; : &#x27;&#x27;) + &#x27;&gt;&#x27; + LABEL[t] + &#x27;&lt;/option&gt;&#x27;; }).join(&#x27;&#x27;) + &#x27;&lt;/select&gt;&#x27; +
        &#x27;&lt;div class=&quot;title&quot; data-tid=&quot;&#x27; + i.id + &#x27;&quot; title=&quot;클릭해서 제목 수정&quot;&gt;&#x27; + esc(i.title || &#x27;(제목 없음)&#x27;) + &#x27;&lt;/div&gt;&#x27; +
        (i.memo ? &#x27;&lt;div class=&quot;memo&quot;&gt;&#x27; + esc(i.memo) + &#x27;&lt;/div&gt;&#x27; : &#x27;&#x27;) +
        &#x27;&lt;div class=&quot;meta&quot;&gt;&lt;span&gt;&#x27; + esc(i.date) + (src ? &#x27; · &lt;a href=&quot;&#x27; + esc(src) + &#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;출처&lt;/a&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/span&gt;&#x27; +
        &#x27;&lt;span&gt;&lt;button class=&quot;edit&quot; data-edit=&quot;&#x27; + i.id + &#x27;&quot;&gt;제목 수정&lt;/button&gt;&lt;button class=&quot;del&quot; data-del=&quot;&#x27; + i.id + &#x27;&quot;&gt;삭제&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
    }).join(&#x27;&#x27;);
  }

  function resize(file, cb) {
    var r = new FileReader();
    r.onload = function () {
      var im = new Image();
      im.onload = function () {
        var max = 900, s = Math.min(1, max / Math.max(im.width, im.height));

  var dlg = document.getElementById(&#x27;dlg&#x27;);
  document.getElementById(&#x27;btnAdd&#x27;).onclick = function () {
    [&#x27;fTitle&#x27;, &#x27;fUrl&#x27;, &#x27;fMemo&#x27;, &#x27;fSrc&#x27;].forEach(function (id) { document.getElementById(id).value = &#x27;&#x27;; });
    document.getElementById(&#x27;fFile&#x27;).value = &#x27;&#x27;;
    dlg.showModal();
  };
  document.getElementById(&#x27;fCancel&#x27;).onclick = function () { dlg.close(); };

    var type = document.querySelector(&#x27;input[name=type]:checked&#x27;).value;
    var base = {
      id: Date.now() + &#x27;&#x27; + Math.floor(Math.random() * 1000), type: type,
      title: document.getElementById(&#x27;fTitle&#x27;).value.trim(),
      memo: document.getElementById(&#x27;fMemo&#x27;).value.trim(),
      src: document.getElementById(&#x27;fSrc&#x27;).value.trim(),
      date: new Date().toISOString().slice(0, 10), img: &#x27;&#x27;

    var f = document.getElementById(&#x27;fFile&#x27;).files[0];
    var url = document.getElementById(&#x27;fUrl&#x27;).value.trim();
    function done(img) { base.img = img; items.unshift(base); save(); render(); dlg.close(); }
    if (f) resize(f, done); else done(url);
  };

  function startEdit(id) {
    var el = document.querySelector(&#x27;[data-tid=&quot;&#x27; + id + &#x27;&quot;]&#x27;);
    var it = items.filter(function (i) { return i.id === id; })[0];

    var inp = document.createElement(&#x27;input&#x27;);

      return;

    var v = e.target.closest(&#x27;[data-view]&#x27;);

  });
  document.getElementById(&#x27;viewClose&#x27;).onclick = function () { document.getElementById(&#x27;viewer&#x27;).close(); };

  document.querySelectorAll(&#x27;.tab&#x27;).forEach(function (t) {

      catch (err) { alert(&#x27;파일을 읽을 수 없어요.&#x27;); }
    };
    r.readAsText(f);
  };

  load(); render();
})();

&lt;div class=&quot;wrap&quot;&gt;
  &lt;h1&gt;🧮 MATLAB 함수 모음&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;function 코드를 통째로 붙여넣어 쌓아두는 곳. 함수 이름은 코드에서 자동으로 읽어요.&lt;/p&gt;
  &lt;div class=&quot;toolbar&quot;&gt;
    &lt;button class=&quot;tab on&quot; data-f=&quot;all&quot;&gt;전체&lt;/button&gt;
    &lt;button class=&quot;tab&quot; data-f=&quot;optics&quot;&gt;🔬 광학&lt;/button&gt;
    &lt;button class=&quot;tab&quot; data-f=&quot;control&quot;&gt;🎛️ 제어공학&lt;/button&gt;
    &lt;span class=&quot;spacer&quot;&gt;&lt;/span&gt;
    &lt;input class=&quot;search&quot; id=&quot;q&quot; type=&quot;search&quot; placeholder=&quot;이름·코드 검색…&quot;&gt;
    &lt;button class=&quot;act&quot; id=&quot;btnAdd&quot;&gt;+ 추가&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid&quot; id=&quot;grid&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;dialog id=&quot;dlg&quot;&gt;&lt;div class=&quot;form&quot;&gt;
  &lt;h2 id=&quot;dTitle&quot;&gt;추가&lt;/h2&gt;
  &lt;div&gt;&lt;label&gt;분류&lt;/label&gt;&lt;select id=&quot;fCat&quot;&gt;&lt;option value=&quot;optics&quot;&gt;광학&lt;/option&gt;&lt;option value=&quot;control&quot;&gt;제어공학&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
  &lt;div&gt;&lt;label&gt;제목 (비우면 코드의 function 이름을 자동 사용)&lt;/label&gt;&lt;input id=&quot;fName&quot; type=&quot;text&quot;&gt;&lt;/div&gt;
  &lt;div&gt;&lt;label&gt;코드 / 텍스트 (function이 아닌 메모·스크립트도 OK)&lt;/label&gt;&lt;textarea id=&quot;fCode&quot; spellcheck=&quot;false&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
  &lt;div style=&quot;display:flex;gap:8px;justify-content:flex-end&quot;&gt;&lt;button class=&quot;ghost&quot; id=&quot;fCancel&quot;&gt;취소&lt;/button&gt;&lt;button class=&quot;act&quot; id=&quot;fSave&quot;&gt;저장&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/dialog&gt;

&lt;script&gt;
(function () {
  var LABEL = { optics: &#x27;광학&#x27;, control: &#x27;제어공학&#x27; };
  var KEY = &#x27;matlab-fn-v2&#x27;, FLAG = &#x27;matlab-fn-v2-init&#x27;;
  var SEED = [
    { c:&#x27;optics&#x27;, t:&#x27;&#x27;, code:
&quot;function E = beam1(x0, y0, w, Lmax, N)\n    t = linspace(-Lmax,Lmax,N); [XX,YY]=meshgrid(t,t);\n    R_moved = sqrt((XX-x0).^2+(YY-y0).^2);\n        E1 = exp(-R_moved.^2/w^2);\n    E = E1;\nend&quot; },
    { c:&#x27;optics&#x27;, t:&#x27;&#x27;, code:
&quot;function y = etaEVA(E_1, E_2)\n% 두 필드 간 오버랩 효율 (mode overlap / coupling efficiency)\n    num = abs(sum(conj(E_1(:)) .* E_2(:)))^2;\n    den = sum(abs(E_1(:)).^2) * sum(abs(E_2(:)).^2);\n    y = num ./ den;\nend&quot; }
  ];
  var items = [], filter = &#x27;all&#x27;, query = &#x27;&#x27;, editing = null;

  function uid() { return Date.now() + &#x27;&#x27; + Math.floor(Math.random() * 1000); }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) items = JSON.parse(raw);
      else if (!localStorage.getItem(FLAG)) {
        items = SEED.map(function (s) { return { id: uid(), c: s.c, t: s.t, code: s.code }; });
        localStorage.setItem(FLAG, &#x27;1&#x27;); save();
      }
    } catch (e) { items = []; }
    if (!Array.isArray(items)) items = [];
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }
  function esc(s) { return String(s == null ? &#x27;&#x27; : s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function (m) { return { &#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27; }[m]; }); }

  function titleOf(it) {
    if (it.t) return it.t;
    var names = [], re = /^[ \t]*function\s+(?:\[[^\]]*\]\s*=\s*|[A-Za-z_]\w*\s*=\s*)?([A-Za-z_]\w*)/gm, m;
    while ((m = re.exec(it.code || &#x27;&#x27;))) names.push(m[1]);
    if (names.length) return names.join(&#x27;, &#x27;);
    var first = (it.code || &#x27;&#x27;).split(&#x27;\n&#x27;).filter(function (l) { return l.trim(); })[0];
    return first ? first.replace(/^[%#\s]+/, &#x27;&#x27;).slice(0, 40) : &#x27;(제목 없음)&#x27;;
  }

  function render() {
    var list = items.filter(function (it) {
      if (filter !== &#x27;all&#x27; &amp;&amp; it.c !== filter) return false;
      return !query || (titleOf(it) + &#x27;\n&#x27; + it.code).toLowerCase().indexOf(query) &gt; -1;
    });
    var g = document.getElementById(&#x27;grid&#x27;);
    if (!list.length) { g.innerHTML = &#x27;&lt;div class=&quot;emptymsg&quot;&gt;&#x27; + (items.length ? &#x27;해당하는 항목이 없어요.&#x27; : &#x27;아직 아무것도 없어요. “+ 추가”로 첫 함수를 넣어보세요.&#x27;) + &#x27;&lt;/div&gt;&#x27;; return; }
    g.innerHTML = list.map(function (it) {
      return &#x27;&lt;div class=&quot;card &#x27; + esc(it.c) + &#x27;&quot;&gt;&#x27; +
        &#x27;&lt;div class=&quot;head&quot;&gt;&lt;span class=&quot;name&quot;&gt;&#x27; + esc(titleOf(it)) + &#x27;&lt;/span&gt;&lt;span class=&quot;badge &#x27; + esc(it.c) + &#x27;&quot;&gt;&#x27; + esc(LABEL[it.c] || it.c) + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27; +
        &#x27;&lt;pre&gt;&#x27; + esc(it.code) + &#x27;&lt;/pre&gt;&#x27; +
        &#x27;&lt;div class=&quot;row&quot;&gt;&lt;button class=&quot;ghost&quot; data-copy=&quot;&#x27; + esc(it.id) + &#x27;&quot;&gt;코드 복사&lt;/button&gt;&#x27; +
        &#x27;&lt;button class=&quot;ghost&quot; data-edit=&quot;&#x27; + esc(it.id) + &#x27;&quot;&gt;수정&lt;/button&gt;&#x27; +
        &#x27;&lt;button class=&quot;ghost&quot; data-del=&quot;&#x27; + esc(it.id) + &#x27;&quot;&gt;삭제&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
    }).join(&#x27;&#x27;);
  }
  function find(id) { return items.filter(function (i) { return i.id === id; })[0]; }

  document.querySelectorAll(&#x27;.tab&#x27;).forEach(function (t) {
    t.onclick = function () {
      document.querySelectorAll(&#x27;.tab&#x27;).forEach(function (x) { x.classList.remove(&#x27;on&#x27;); });
      t.classList.add(&#x27;on&#x27;); filter = t.dataset.f; render();
    };
  });
  document.getElementById(&#x27;q&#x27;).oninput = function (e) { query = e.target.value.trim().toLowerCase(); render(); };

  var dlg = document.getElementById(&#x27;dlg&#x27;), fCode = document.getElementById(&#x27;fCode&#x27;);
  function openForm(it) {
    editing = it ? it.id : null;
    document.getElementById(&#x27;dTitle&#x27;).textContent = it ? &#x27;수정&#x27; : &#x27;추가&#x27;;
    document.getElementById(&#x27;fCat&#x27;).value = it ? it.c : (filter === &#x27;control&#x27; ? &#x27;control&#x27; : &#x27;optics&#x27;);
    document.getElementById(&#x27;fName&#x27;).value = it ? it.t : &#x27;&#x27;;
    fCode.value = it ? it.code : &#x27;&#x27;;
    dlg.showModal();
  }
  document.getElementById(&#x27;btnAdd&#x27;).onclick = function () { openForm(null); };
  document.getElementById(&#x27;fCancel&#x27;).onclick = function () { dlg.close(); };
  fCode.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;Tab&#x27;) {
      e.preventDefault();
      var s = fCode.selectionStart, en = fCode.selectionEnd;
      fCode.value = fCode.value.slice(0, s) + &#x27;    &#x27; + fCode.value.slice(en);
      fCode.selectionStart = fCode.selectionEnd = s + 4;
    }
  });
  document.getElementById(&#x27;fSave&#x27;).onclick = function () {
    var code = fCode.value.replace(/\s+$/, &#x27;&#x27;);
    if (!code.trim()) { alert(&#x27;내용을 입력하세요.&#x27;); return; }
    var data = { c: document.getElementById(&#x27;fCat&#x27;).value, t: document.getElementById(&#x27;fName&#x27;).value.trim(), code: code };
    if (editing) { var it = find(editing); if (it) { it.c = data.c; it.t = data.t; it.code = data.code; } }
    else items.unshift({ id: uid(), c: data.c, t: data.t, code: data.code });
    save(); render(); dlg.close();
  };

  document.getElementById(&#x27;grid&#x27;).addEventListener(&#x27;click&#x27;, function (e) {
    var c = e.target.closest(&#x27;[data-copy]&#x27;);
    if (c) {
      var it = find(c.dataset.copy); if (!it) return;
      var ok = function () { var o = c.textContent; c.textContent = &#x27;복사됨 ✓&#x27;; setTimeout(function () { c.textContent = o; }, 1200); };
      var fb = function () { var ta = document.createElement(&#x27;textarea&#x27;); ta.value = it.code; document.body.appendChild(ta); ta.select(); try { document.execCommand(&#x27;copy&#x27;); ok(); } catch (er) {} ta.remove(); };
      try { navigator.clipboard.writeText(it.code).then(ok, fb); } catch (er) { fb(); }
      return;
    }
    var ed = e.target.closest(&#x27;[data-edit]&#x27;);
    if (ed) { openForm(find(ed.dataset.edit)); return; }
    var d = e.target.closest(&#x27;[data-del]&#x27;);
    if (d &amp;&amp; confirm(&#x27;이 항목을 삭제할까요?&#x27;)) { items = items.filter(function (i) { return i.id !== d.dataset.del; }); save(); render(); }
  });

  load(); render();
})();
&lt;/script&gt;

&lt;style&gt;

&lt;div class=&quot;wrap&quot;&gt;

  &lt;div class=&quot;form&quot;&gt;
    &lt;input type=&quot;date&quot; id=&quot;fDate&quot;&gt;
    &lt;input type=&quot;text&quot; id=&quot;fTitle&quot; placeholder=&quot;일정 내용&quot; maxlength=&quot;100&quot;&gt;
    &lt;button class=&quot;act&quot; id=&quot;fOk&quot;&gt;추가&lt;/button&gt;

&lt;script&gt;
(function () {
  var KEY = &#x27;schedule-v1&#x27;, FLAG = &#x27;schedule-v1-init&#x27;;
  var seed = [
    { id: &#x27;s1&#x27;, date: &#x27;2026-10-31&#x27;, title: &#x27;연구실 청소&#x27; },
    { id: &#x27;s2&#x27;, date: &#x27;2026-10-27&#x27;, title: &#x27;구의역에서 교육이수하기&#x27; },
    { id: &#x27;s3&#x27;, date: &#x27;2026-10-20&#x27;, title: &#x27;500W 테스트&#x27; },
    { id: &#x27;s4&#x27;, date: &#x27;2026-10-15&#x27;, title: &#x27;폐시약통 처리&#x27; }
  ];
  var items = [], markerId = null, editId = null, dragging = false;
  var $ = function (id) { return document.getElementById(id); };
  var DAYS = [&#x27;일&#x27;, &#x27;월&#x27;, &#x27;화&#x27;, &#x27;수&#x27;, &#x27;목&#x27;, &#x27;금&#x27;, &#x27;토&#x27;];

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var o = JSON.parse(raw); items = o.items || []; markerId = o.markerId || null; }
      else if (!localStorage.getItem(FLAG)) { items = seed.slice(); localStorage.setItem(FLAG, &#x27;1&#x27;); save(); }
    } catch (e) { if (!items.length) items = seed.slice(); }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ items: items, markerId: markerId })); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function (c) { return { &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; }[c]; }); }
  function pad(n) { return (n &lt; 10 ? &#x27;0&#x27; : &#x27;&#x27;) + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + &#x27;-&#x27; + pad(d.getMonth() + 1) + &#x27;-&#x27; + pad(d.getDate()); }
  function utc(s) { var p = s.split(&#x27;-&#x27;); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function diff(s) { return Math.round((utc(s) - utc(todayStr())) / 86400000); }
  function dow(s) { return DAYS[new Date(utc(s)).getUTCDay()]; }
  function badge(n) {
    if (n === 0) return &#x27;&lt;span class=&quot;diff now&quot;&gt;D-DAY · 오늘&lt;/span&gt;&#x27;;
    if (n &gt; 0) return &#x27;&lt;span class=&quot;diff future&quot;&gt;D-&#x27; + n + &#x27; · &#x27; + n + &#x27;일 뒤&lt;/span&gt;&#x27;;
    return &#x27;&lt;span class=&quot;diff past&quot;&gt;D+&#x27; + (-n) + &#x27; · &#x27; + (-n) + &#x27;일 지남&lt;/span&gt;&#x27;;
  }
  function diffText(n) { return n === 0 ? &#x27;오늘&#x27; : n &gt; 0 ? &#x27;오늘로부터 &#x27; + n + &#x27;일 뒤&#x27; : &#x27;오늘로부터 &#x27; + (-n) + &#x27;일 전&#x27;; }
  function sorted() {
    return items.slice().sort(function (a, b) { return a.date &lt; b.date ? 1 : a.date &gt; b.date ? -1 : 0; });
  }
  function markText() {
    var it = items.filter(function (i) { return i.id === markerId; })[0];
    if (!it) return &#x27;📍 맨 위&#x27;;
    return &#x27;📍 &#x27; + it.date + &#x27; 아래 · &#x27; + diffText(diff(it.date));
  }
  function markHtml() { return &#x27;&lt;div class=&quot;markline&quot; id=&quot;mark&quot;&gt;&lt;span class=&quot;tag&quot; id=&quot;markTag&quot;&gt;&#x27; + markText() + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;; }

  function render() {
    var t = todayStr(), list = sorted();
    var up = list.filter(function (i) { return i.date &gt;= t; }).length;
    $(&#x27;sub&#x27;).textContent = &#x27;오늘 &#x27; + t + &#x27; (&#x27; + dow(t) + &#x27;) · 전체 &#x27; + list.length + &#x27;개 · 오늘 이후 &#x27; + up + &#x27;개 · 분홍 선은 드래그하거나 📍 버튼으로 옮겨요&#x27;;
    if (!items.some(function (i) { return i.id === markerId; })) markerId = null;
    var todayIdx = -1;
    list.forEach(function (i, k) { if (i.date &gt;= t) todayIdx = k; });
    var todayLine = &#x27;&lt;div class=&quot;todayline&quot;&gt;&lt;span&gt;오늘 &#x27; + t + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
    var h = &#x27;&#x27;;
    if (!list.length) { $(&#x27;list&#x27;).innerHTML = &#x27;&lt;div class=&quot;empty&quot;&gt;일정이 없어요. 위에서 추가해 보세요.&lt;/div&gt;&#x27;; return; }
    if (todayIdx === -1) h += todayLine;
    if (markerId === null) h += markHtml();
    list.forEach(function (i, k) {
      var n = diff(i.date);
      h += &#x27;&lt;div class=&quot;row &#x27; + (n &lt; 0 ? &#x27;past&#x27; : &#x27;&#x27;) + &#x27;&quot; data-id=&quot;&#x27; + i.id + &#x27;&quot;&gt;&#x27; +
        &#x27;&lt;div class=&quot;date&quot;&gt;날짜 &lt;b&gt;&#x27; + i.date + &#x27;&lt;/b&gt; (&#x27; + dow(i.date) + &#x27;)&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;title&quot;&gt;&#x27; + esc(i.title) + &#x27;&lt;/div&gt;&#x27; + badge(n) +
        &#x27;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;ghost&quot; data-mk=&quot;&#x27; + i.id + &#x27;&quot; title=&quot;분홍 선을 여기로&quot;&gt;📍&lt;/button&gt;&#x27; +
        &#x27;&lt;button class=&quot;ghost&quot; data-ed=&quot;&#x27; + i.id + &#x27;&quot;&gt;✏️&lt;/button&gt;&#x27; +
        &#x27;&lt;button class=&quot;ghost&quot; data-del=&quot;&#x27; + i.id + &#x27;&quot;&gt;🗑️&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
      if (k === todayIdx) h += todayLine;
      if (i.id === markerId) h += markHtml();
    });
    $(&#x27;list&#x27;).innerHTML = h;
    bindDrag();
  }

  function bindDrag() {
    var m = $(&#x27;mark&#x27;); if (!m) return;
    m.addEventListener(&#x27;pointerdown&#x27;, function (e) {
      dragging = true; m.setPointerCapture(e.pointerId); e.preventDefault();
    });
    m.addEventListener(&#x27;pointermove&#x27;, function (e) {
      if (!dragging) return;
      var rows = $(&#x27;list&#x27;).querySelectorAll(&#x27;.row&#x27;), newId = null, anchor = null;
      rows.forEach(function (r) {
        var b = r.getBoundingClientRect();
        if (e.clientY &gt; b.top + b.height / 2) { newId = r.dataset.id; anchor = r; }
      });
      markerId = newId;
      var l = $(&#x27;list&#x27;);
      if (anchor) l.insertBefore(m, anchor.nextSibling); else l.insertBefore(m, l.querySelector(&#x27;.row&#x27;));
      $(&#x27;markTag&#x27;).textContent = markText();
    });
    function end() { if (!dragging) return; dragging = false; save(); render(); }
    m.addEventListener(&#x27;pointerup&#x27;, end);
    m.addEventListener(&#x27;pointercancel&#x27;, end);
  }

  function resetForm() { editId = null; $(&#x27;fTitle&#x27;).value = &#x27;&#x27;; $(&#x27;fOk&#x27;).textContent = &#x27;추가&#x27;; $(&#x27;fCancel&#x27;).style.display = &#x27;none&#x27;; }

  $(&#x27;fOk&#x27;).addEventListener(&#x27;click&#x27;, function () {
    var d = $(&#x27;fDate&#x27;).value, tt = $(&#x27;fTitle&#x27;).value.trim();
    if (!d || !tt) { alert(&#x27;날짜와 내용을 입력하세요.&#x27;); return; }
    if (editId) {
      items.forEach(function (i) { if (i.id === editId) { i.date = d; i.title = tt; } });
    } else {
      items.push({ id: &#x27;i&#x27; + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), date: d, title: tt });
    }
    resetForm(); save(); render();
  });
  $(&#x27;fCancel&#x27;).addEventListener(&#x27;click&#x27;, resetForm);
  $(&#x27;fTitle&#x27;).addEventListener(&#x27;keydown&#x27;, function (e) { if (e.key === &#x27;Enter&#x27;) $(&#x27;fOk&#x27;).click(); });

  $(&#x27;list&#x27;).addEventListener(&#x27;click&#x27;, function (e) {
    var mk = e.target.closest(&#x27;[data-mk]&#x27;);
    if (mk) { markerId = mk.dataset.mk; save(); render(); return; }
    var ed = e.target.closest(&#x27;[data-ed]&#x27;);
    if (ed) {
      var it = items.filter(function (i) { return i.id === ed.dataset.ed; })[0]; if (!it) return;
      editId = it.id; $(&#x27;fDate&#x27;).value = it.date; $(&#x27;fTitle&#x27;).value = it.title;
      $(&#x27;fOk&#x27;).textContent = &#x27;저장&#x27;; $(&#x27;fCancel&#x27;).style.display = &#x27;&#x27;; $(&#x27;fTitle&#x27;).focus(); return;
    }
    var d = e.target.closest(&#x27;[data-del]&#x27;);
    if (d &amp;&amp; confirm(&#x27;이 일정을 삭제할까요?&#x27;)) {
      items = items.filter(function (i) { return i.id !== d.dataset.del; });
      if (editId === d.dataset.del) resetForm();
      save(); render();
    }
  });

  $(&#x27;fDate&#x27;).value = todayStr();
  load(); render();
  setInterval(function () { if (!dragging) render(); }, 60000);
})();

  $(&#x27;file&#x27;).addEventListener(&#x27;change&#x27;, function () {

    var r = new FileReader();
    r.onload = function () {
      var o;
      try { o = JSON.parse(r.result); } catch (e) { say(&#x27;JSON 형식이 아니에요.&#x27;, true); return; }
      if (!o || o.app !== APP || !o.data || typeof o.data !== &#x27;object&#x27;) { say(&#x27;이 앱에서 내보낸 파일이 아니에요.&#x27;, true); return; }
      var ks = KEYS.map(function (p) { return p[0]; }).filter(function (k) { return k in o.data; });
      if (!ks.length) { say(&#x27;불러올 데이터가 없어요.&#x27;, true); return; }
      if (!confirm(&#x27;파일의 데이터로 현재 데이터를 덮어쓸까요? (&#x27; + ks.length + &#x27;개 항목)&#x27;)) return;
      try {
        ks.forEach(function (k) { localStorage.setItem(k, JSON.stringify(o.data[k])); });
      } catch (e) { say(&#x27;저장에 실패했어요.&#x27;, true); return; }
      renderTbl();
      try {
        var self = window.frameElement;
        parent.document.querySelectorAll(&#x27;iframe.pane&#x27;).forEach(function (fr) {
          if (fr === self) return;
          var s = fr.srcdoc; fr.srcdoc = &#x27;&#x27;; fr.srcdoc = s;
        });
        say(&#x27;불러왔어요. 다른 탭에 바로 반영됐어요.&#x27;);
      } catch (e) { say(&#x27;불러왔어요. 페이지를 새로고침하면 반영돼요.&#x27;); }
    };
    r.readAsText(f);
  });

  renderTbl();
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
</div>
<script>
(function () {
  var K = 'mate-active-tab';
  var tabs = document.querySelectorAll('.toptab');
  function show(t) {
    tabs.forEach(function (b) { b.classList.toggle('on', b.dataset.t === t); });
    document.querySelectorAll('.pane').forEach(function (p) { p.classList.toggle('on', p.id === 'p-' + t); });
    try { localStorage.setItem(K, t); } catch (e) {}
  }
  tabs.forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.t); }); });
  var saved = null;
  try { saved = localStorage.getItem(K); } catch (e) {}
  if (saved === 'graph' || saved === 'work' || saved === 'matlab' || saved === 'schedule' || saved === 'menu' || saved === 'data') show(saved);
})();
</script>
