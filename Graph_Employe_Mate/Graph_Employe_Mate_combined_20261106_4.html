  .fadd { border:1px dashed #b8c4dc; background:#fff; color:#6b7487; border-radius:8px; padding:4px 11px; font-size:13px; font-weight:600; cursor:pointer; }

  .fpop { position:absolute; left:14px; z-index:60; width:340px; max-width:calc(100vw - 28px); border:1px solid #d5dce5; border-radius:10px; padding:10px; background:#fafbfe; box-shadow:0 6px 20px rgba(31,79,204,.18); }

  .fpop textarea { min-height:96px; resize:vertical; }
  .fpop textarea::placeholder { color:#9aa3b5; }
  .fpop .pb { display:flex; gap:6px; align-items:center; }
  .fpop .pb .sp { flex:1; }
  .fpop .pb button { border:1px solid #d5dce5; background:#fff; color:#44506b; border-radius:8px; padding:5px 12px; font-size:13px; font-weight:600; cursor:pointer; }

  .fpop .pb .danger:hover { border-color:#c0392b; color:#c0392b; }
  #ftip { position:fixed; z-index:70; display:none; width:max-content; max-width:280px; background:#fff; color:#1d2733; border:1px solid #b9c8f0; border-radius:10px; padding:9px 12px; font-size:12.5px; line-height:1.55; box-shadow:0 6px 20px rgba(31,79,204,.18); pointer-events:none; }

&lt;script&gt;
(function () {
  var KEY = &#x27;graph-archive-v1&#x27;;
  var LABEL = { interest: &#x27;관심&#x27;, sim: &#x27;내 시뮬&#x27;, exp: &#x27;내 실험&#x27; };
  var items = [], filter = &#x27;all&#x27;, goal = 10;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var d = JSON.parse(raw); items = d.items || []; goal = d.goal || 10; }
    } catch (e) { items = []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ items: items, goal: goal })); }
    catch (e) { alert(&#x27;저장 공간이 부족해요. 내보내기로 백업하거나 이미지 대신 URL을 써 보세요.&#x27;); }
  }
  function esc(s) { return String(s || &#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function (c) { return { &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || &#x27;&#x27;) ? u : &#x27;&#x27;; }
  function safeImg(u) { return /^(https?:\/\/|data:image\/)/i.test(u || &#x27;&#x27;) ? u : &#x27;&#x27;; }

  function render() {
    var n = { interest: 0, sim: 0, exp: 0 };
    items.forEach(function (i) { n[i.type]++; });
    document.getElementById(&#x27;sAll&#x27;).textContent = items.length;

    g.innerHTML = list.map(function (i) {

      return &#x27;&lt;div class=&quot;frame &#x27; + i.type + &#x27;&quot;&gt;&lt;div class=&quot;card&quot;&gt;&#x27; +
        (img ? &#x27;&lt;div class=&quot;thumb&quot; data-view=&quot;&#x27; + i.id + &#x27;&quot;&gt;&lt;img src=&quot;&#x27; + esc(img) + &#x27;&quot; alt=&quot;&quot;&gt;&lt;/div&gt;&#x27; : &#x27;&lt;div class=&quot;thumb empty&quot;&gt;이미지 없음&lt;/div&gt;&#x27;) +
        &#x27;&lt;div class=&quot;info&quot;&gt;&lt;select class=&quot;badge &#x27; + i.type + &#x27;&quot; data-type=&quot;&#x27; + i.id + &#x27;&quot; title=&quot;분류 변경&quot;&gt;&#x27; + [&#x27;interest&#x27;, &#x27;sim&#x27;, &#x27;exp&#x27;].map(function (t) { return &#x27;&lt;option value=&quot;&#x27; + t + &#x27;&quot;&#x27; + (t === i.type ? &#x27; selected&#x27; : &#x27;&#x27;) + &#x27;&gt;&#x27; + LABEL[t] + &#x27;&lt;/option&gt;&#x27;; }).join(&#x27;&#x27;) + &#x27;&lt;/select&gt;&#x27; +
        &#x27;&lt;div class=&quot;title&quot; data-tid=&quot;&#x27; + i.id + &#x27;&quot; title=&quot;클릭해서 제목 수정&quot;&gt;&#x27; + esc(i.title || &#x27;(제목 없음)&#x27;) + &#x27;&lt;/div&gt;&#x27; +

        &#x27;&lt;span&gt;&lt;button class=&quot;edit&quot; data-edit=&quot;&#x27; + i.id + &#x27;&quot;&gt;제목 수정&lt;/button&gt;&lt;button class=&quot;del&quot; data-del=&quot;&#x27; + i.id + &#x27;&quot;&gt;삭제&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;

  function resize(file, cb) {

  function startEdit(id) {

    r.readAsText(f);
  };

  load(); render();

  .eq { margin-top:12px; }
  .eqrow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chip { display:inline-flex; align-items:center; border:1px solid #c3d2f7; background:#eef3ff; color:#1f3f9e; border-radius:8px; padding:4px 11px; font-size:13px; font-weight:700; cursor:pointer; }
  .chip:hover { border-color:var(--accent); background:#e0e9ff; color:#1f3f9e; }
  .chip.nospec { border-style:dashed; border-color:#cfd6e4; background:#f5f7fb; color:#6b7487; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip.addeq { border-style:dashed; border-color:#b8c4dc; background:#fff; color:#6b7487; font-weight:600; }
  .chip.addeq:hover { border-color:var(--accent); color:var(--accent); background:#fff; }
  .eqed { margin-top:8px; border:1px solid var(--line); border-radius:10px; padding:10px; background:#fafbfe; }
  .eqed input, .card .eqed textarea { display:block; width:100%; margin:0 0 6px; border:1px solid #d5dce5; border-radius:8px; padding:7px 9px; font-size:14px; line-height:1.5; font-family:inherit; background:#fff; color:var(--text); caret-color:auto; }
  .card .eqed textarea { min-height:96px; resize:vertical; position:static; }
  .card .eqed textarea::placeholder { color:#9aa3b5; }
  .eqed .btns { display:flex; gap:6px; align-items:center; }
  .eqed .btns .sp { flex:1; }
  .eqed button.danger { color:#c0392b; }
  .eqed button.danger:hover { border-color:#c0392b; color:#c0392b; }
    .chip { user-select:none; -webkit-user-select:none; }
  .chip.dragging { opacity:.35; }
  .slide.over { background:#eef3ff; border-radius:10px; box-shadow:0 0 0 2px #9db6f2; }
  .eqrow { min-height:30px; }
  #tip { position:fixed; z-index:60; display:none; width:max-content; max-width:280px; background:#fff; color:var(--text); border:1px solid #b9c8f0; border-radius:10px; padding:9px 12px; font-size:12.5px; line-height:1.55; box-shadow:0 6px 20px rgba(31,79,204,.18); pointer-events:none; }
  #tip .tn { font-weight:800; color:var(--accent); font-size:13px; margin-bottom:3px; }
  #tip .tl { min-height:1.2em; overflow-wrap:anywhere; }
  #tip .tl b { color:#44506b; margin-right:4px; }
  #tip .tnone { color:var(--muted); }
&lt;/style&gt;

&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;h1&gt;🔬 실험실 사진&lt;/h1&gt;
  &lt;div class=&quot;sub&quot;&gt;GitHub 폴더에 사진을 올리면 자동으로 나타나요. SFOT1, SFOT2처럼 이름 뒤에 번호를 붙이면 한 묶음이 되어 옆으로 넘겨 볼 수 있어요. 사진 아래 ＋ 장비명으로 장비를 추가하고, 장비명에 마우스를 올리면 스펙이 보여요. 장비명 블록을 끌어다 다른 사진에 놓으면 옮겨져요.&lt;/div&gt;
  &lt;div class=&quot;bar&quot;&gt;
    &lt;button id=&quot;bGear&quot;&gt;⚙️ 저장소 설정&lt;/button&gt;
    &lt;button id=&quot;bRef&quot;&gt;🔄 새로고침&lt;/button&gt;
    &lt;select id=&quot;sSort&quot;&gt;
      &lt;option value=&quot;asc&quot;&gt;묶음 이름 A → Z&lt;/option&gt;
      &lt;option value=&quot;desc&quot;&gt;묶음 이름 Z → A&lt;/option&gt;
    &lt;/select&gt;
    &lt;span class=&quot;sp&quot;&gt;&lt;/span&gt;
    &lt;span id=&quot;status&quot;&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;settings&quot; id=&quot;settings&quot;&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;div&gt;&lt;label&gt;GitHub 계정&lt;/label&gt;&lt;input id=&quot;cOwner&quot; type=&quot;text&quot; placeholder=&quot;seagull615&quot;&gt;&lt;/div&gt;
      &lt;div&gt;&lt;label&gt;저장소 이름&lt;/label&gt;&lt;input id=&quot;cRepo&quot; type=&quot;text&quot; placeholder=&quot;저장소 이름&quot;&gt;&lt;/div&gt;
      &lt;div&gt;&lt;label&gt;사진 폴더&lt;/label&gt;&lt;input id=&quot;cFolder&quot; type=&quot;text&quot; placeholder=&quot;lab_photos&quot;&gt;&lt;/div&gt;
      &lt;div&gt;&lt;label&gt;브랜치 (비우면 기본)&lt;/label&gt;&lt;input id=&quot;cBranch&quot; type=&quot;text&quot; placeholder=&quot;main&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;button class=&quot;act&quot; id=&quot;bSave&quot;&gt;저장하고 불러오기&lt;/button&gt;
    &lt;div class=&quot;hint&quot;&gt;공개(public) 저장소만 읽을 수 있어요. 폴더 안의 png, jpg, gif, webp, svg 파일을 표시하고, 메모는 파일 이름에 붙어서 이 브라우저에 저장돼요. 사진 파일 이름을 바꾸면 메모가 떨어지니 이름은 유지하는 게 좋아요.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div id=&quot;list&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;orph&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div id=&quot;lb&quot;&gt;&lt;button class=&quot;lbn&quot; id=&quot;lbPrev&quot; aria-label=&quot;이전&quot;&gt;‹&lt;/button&gt;&lt;img id=&quot;lbImg&quot; alt=&quot;&quot;&gt;&lt;button class=&quot;lbn&quot; id=&quot;lbNext&quot; aria-label=&quot;다음&quot;&gt;›&lt;/button&gt;&lt;div id=&quot;lbPos&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;script&gt;
(function () {
  var MKEY = &#x27;lab-photo-memo-v1&#x27;, CKEY = &#x27;lab-photo-cfg-v1&#x27;, CACHE = &#x27;lab-photo-cache-v1&#x27;;
  var $ = function (id) { return document.getElementById(id); };
  var ESC = { &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; };
  function esc(s) { return String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function (c) { return ESC[c]; }); }
  function hlHtml(s) { return esc(s).replace(/\[[^\[\]\n]*\]/g, function (m) { return &#x27;&lt;mark class=&quot;br&quot;&gt;&#x27; + m + &#x27;&lt;/mark&gt;&#x27;; }); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  var cfg = loadCfg(), memos = loadMemos(), files = [];

  function loadCfg() {
    var d = { owner: &#x27;seagull615&#x27;, repo: &#x27;&#x27;, folder: &#x27;lab_photos&#x27;, branch: &#x27;&#x27;, sort: &#x27;asc&#x27; };
    try {
      var o = JSON.parse(lsGet(CKEY));
      if (o &amp;&amp; typeof o === &#x27;object&#x27;) for (var k in d) if (typeof o[k] === &#x27;string&#x27;) d[k] = o[k];
    } catch (e) {}
    return d;
  }
  function saveCfg() { lsSet(CKEY, JSON.stringify(cfg)); }
  function loadMemos() {
    var m = {};
    try {
      var o = JSON.parse(lsGet(MKEY));
      if (o &amp;&amp; Array.isArray(o.items)) o.items.forEach(function (x) {
        if (x &amp;&amp; typeof x.file === &#x27;string&#x27; &amp;&amp; typeof x.memo === &#x27;string&#x27;) m[x.file] = x.memo;
      });
    } catch (e) {}
    return m;
  }
  function saveMemos() {
    var items = [];
    Object.keys(memos).forEach(function (f) { if (memos[f].trim()) items.push({ file: f, memo: memos[f] }); });
    return lsSet(MKEY, JSON.stringify({ items: items }));
  }

  function status(t, err) { $(&#x27;status&#x27;).textContent = t || &#x27;&#x27;; $(&#x27;status&#x27;).className = err ? &#x27;err&#x27; : &#x27;&#x27;; }

  function apiUrl() {
    var path = cfg.folder.split(&#x27;/&#x27;).filter(Boolean).map(encodeURIComponent).join(&#x27;/&#x27;);
    var u = &#x27;https://api.github.com/repos/&#x27; + encodeURIComponent(cfg.owner) + &#x27;/&#x27; + encodeURIComponent(cfg.repo) + &#x27;/contents&#x27; + (path ? &#x27;/&#x27; + path : &#x27;&#x27;);
    if (cfg.branch) u += &#x27;?ref=&#x27; + encodeURIComponent(cfg.branch);
    return u;
  }
  function cacheKey() { return cfg.owner + &#x27;/&#x27; + cfg.repo + &#x27;/&#x27; + cfg.folder + &#x27;@&#x27; + cfg.branch; }
  function readCache() { try { return JSON.parse(lsGet(CACHE)); } catch (e) { return null; } }

  function load(force) {
    if (!cfg.owner || !cfg.repo) {
      files = []; render(); $(&#x27;settings&#x27;).classList.add(&#x27;on&#x27;);
      status(&#x27;저장소를 설정해 주세요.&#x27;); return;
    }
    var c = readCache();
    if (!force &amp;&amp; c &amp;&amp; c.key === cacheKey() &amp;&amp; Array.isArray(c.files) &amp;&amp; Date.now() - c.t &lt; 300000) {
      files = c.files; render(); status(&#x27;사진 &#x27; + files.length + &#x27;장 (캐시)&#x27;); return;
    }
    status(&#x27;불러오는 중…&#x27;);
    fetch(apiUrl(), { headers: { &#x27;Accept&#x27;: &#x27;application/vnd.github+json&#x27; } }).then(function (r) {
      if (!r.ok) { var e = new Error(&#x27;http&#x27;); e.code = r.status; throw e; }
      return r.json();
    }).then(function (list) {
      if (!Array.isArray(list)) throw new Error(&#x27;notdir&#x27;);
      files = list.filter(function (f) { return f.type === &#x27;file&#x27; &amp;&amp; /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(f.name); })
                  .map(function (f) { return { name: f.name, url: f.download_url }; });
      lsSet(CACHE, JSON.stringify({ key: cacheKey(), t: Date.now(), files: files }));
      render(); status(&#x27;사진 &#x27; + files.length + &#x27;장&#x27;);
    }).catch(function (e) {
      var msg = &#x27;불러오지 못했어요.&#x27;;
      if (e.code === 404) msg = &#x27;저장소나 폴더를 찾지 못했어요. 이름과 공개 여부를 확인해 주세요.&#x27;;
      else if (e.code === 403) msg = &#x27;GitHub 호출 한도에 걸렸어요. 잠시 후 다시 시도해 주세요.&#x27;;
      else if (e.message === &#x27;notdir&#x27;) msg = &#x27;폴더가 아니라 파일을 가리키고 있어요.&#x27;;
      else msg = &#x27;네트워크 오류예요. 연결을 확인해 주세요.&#x27;;
      var c2 = readCache();
      if (c2 &amp;&amp; c2.key === cacheKey() &amp;&amp; Array.isArray(c2.files)) { files = c2.files; render(); msg += &#x27; (이전에 불러온 목록을 보여줘요)&#x27;; }
      else { files = []; render(); }
      status(msg, true);
    });
  }

  function baseName(n) { return n.replace(/\.[^.]+$/, &#x27;&#x27;); }
  function parseName(n) {
    var b = baseName(n);
    var m = b.match(/^(.*?)[\s_\-]*\(?(\d+)\)?$/);
    if (m &amp;&amp; m[1]) return { key: m[1], num: parseInt(m[2], 10) };
    return { key: b, num: 0 };
  }
  function groups() {
    var map = Object.create(null), order = [];
    files.forEach(function (f) {
      var q = parseName(f.name);
      if (!map[q.key]) { map[q.key] = []; order.push(q.key); }
      map[q.key].push({ f: f, num: q.num });
    });
    order.sort(function (a, b) { return a.localeCompare(b, &#x27;ko&#x27;, { numeric: true }); });
    if (cfg.sort === &#x27;desc&#x27;) order.reverse();
    return order.map(function (k) {
      var items = map[k].sort(function (x, y) { return (x.num - y.num) || x.f.name.localeCompare(y.f.name, &#x27;ko&#x27;, { numeric: true }); })
                        .map(function (x) { return x.f; });
      return { key: k, items: items };
    });
  }

  var curGroups = [];
  function render() {
    var gs = curGroups = groups(), h = &#x27;&#x27;;
    if (!gs.length) {
      h = &#x27;&lt;div class=&quot;empty&quot;&gt;&#x27; + (cfg.repo ? &#x27;GitHub 폴더에 사진이 없어요.&lt;br&gt;사진을 올리고 🔄 새로고침을 눌러 보세요.&#x27; : &#x27;⚙️ 저장소 설정에서 저장소와 폴더를 지정하면&lt;br&gt;그 폴더의 사진이 여기에 나타나요.&#x27;) + &#x27;&lt;/div&gt;&#x27;;
    }
    gs.forEach(function (g, gi) {
      var n = g.items.length;
      h += &#x27;&lt;div class=&quot;card&quot; data-g=&quot;&#x27; + gi + &#x27;&quot;&gt;&lt;div class=&quot;ghead&quot;&gt;&lt;h3&gt;&#x27; + esc(n &gt; 1 ? g.key : baseName(g.items[0].name)) + &#x27;&lt;/h3&gt;&#x27; +
        (n &gt; 1 ? &#x27;&lt;span class=&quot;pos&quot;&gt;1 / &#x27; + n + &#x27;&lt;/span&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/div&gt;&lt;div class=&quot;trackwrap&quot;&gt;&#x27; +
        (n &gt; 1 ? &#x27;&lt;button class=&quot;nav prev&quot; data-d=&quot;-1&quot; aria-label=&quot;이전&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;nav next&quot; data-d=&quot;1&quot; aria-label=&quot;다음&quot;&gt;›&lt;/button&gt;&#x27; : &#x27;&#x27;) +
        &#x27;&lt;div class=&quot;track&quot; tabindex=&quot;0&quot;&gt;&#x27;;
      g.items.forEach(function (f, i) {
        h += &#x27;&lt;div class=&quot;slide&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;&#x27; + esc(f.url) + &#x27;&quot; alt=&quot;&#x27; + esc(f.name) + &#x27;&quot; data-i=&quot;&#x27; + i + &#x27;&quot;&gt;&#x27; +
          (n &gt; 1 ? &#x27;&lt;div class=&quot;cap&quot;&gt;&#x27; + esc(baseName(f.name)) + &#x27;&lt;/div&gt;&#x27; : &#x27;&#x27;) +
          &#x27;&lt;div class=&quot;eq&quot; data-f=&quot;&#x27; + esc(f.name) + &#x27;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
      });
      h += &#x27;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
    });
    $(&#x27;list&#x27;).innerHTML = h;
    $(&#x27;list&#x27;).querySelectorAll(&#x27;textarea&#x27;).forEach(fit);
    refreshAllEq();
    var names = {}; files.forEach(function (f) { names[f.name] = 1; });
    var orph = [];
    $(&#x27;orph&#x27;).innerHTML = (files.length &amp;&amp; orph.length)
      ? &#x27;&lt;details class=&quot;orph&quot;&gt;&lt;summary&gt;사진이 없는 메모 &#x27; + orph.length + &#x27;개&lt;/summary&gt;&#x27; +
        orph.map(function (k) { return &#x27;&lt;div&gt;&lt;b&gt;&#x27; + esc(k) + &#x27;&lt;/b&gt;\n&#x27; + hlHtml(memos[k]) + &#x27;&lt;/div&gt;&#x27;; }).join(&#x27;&#x27;) + &#x27;&lt;/details&gt;&#x27;
      : &#x27;&#x27;;
  }
  function fit(t) { t.style.height = &#x27;auto&#x27;; t.style.height = Math.max(64, t.scrollHeight + 2) + &#x27;px&#x27;; }

  var timer = null;
  $(&#x27;list&#x27;).addEventListener(&#x27;input&#x27;, function (e) {
    var t = e.target; if (t.tagName !== &#x27;TEXTAREA&#x27; || t.classList.contains(&#x27;eqspec&#x27;)) return;
    fit(t); memos[t.dataset.f] = t.value;
    var hl = t.previousElementSibling; if (hl) hl.innerHTML = hlHtml(t.value) + (/\n$/.test(t.value) ? &#x27; &#x27; : &#x27;&#x27;);
    clearTimeout(timer);
    timer = setTimeout(function () { status(saveMemos() ? &#x27;메모 저장됨&#x27; : &#x27;메모 저장 실패&#x27;, false); }, 400);
  });
  document.addEventListener(&#x27;error&#x27;, function (e) {
    var t = e.target;
    if (t &amp;&amp; t.tagName === &#x27;IMG&#x27; &amp;&amp; t.parentNode &amp;&amp; t.id !== &#x27;lbImg&#x27;) {
      var d = document.createElement(&#x27;div&#x27;); d.className = &#x27;imgerr&#x27;; d.textContent = &#x27;사진을 불러오지 못했어요.&#x27;;
      t.parentNode.replaceChild(d, t);
    }
  }, true);

  var lbItems = [], lbIdx = 0;
  function lbShow() {
    $(&#x27;lbImg&#x27;).src = lbItems[lbIdx].url;
    var multi = lbItems.length &gt; 1;
    $(&#x27;lbPos&#x27;).textContent = multi ? (lbIdx + 1) + &#x27; / &#x27; + lbItems.length : &#x27;&#x27;;
    $(&#x27;lbPrev&#x27;).style.display = multi ? &#x27;&#x27; : &#x27;none&#x27;;
    $(&#x27;lbNext&#x27;).style.display = multi ? &#x27;&#x27; : &#x27;none&#x27;;
  }
  function lbStep(d) { if (lbItems.length &gt; 1) { lbIdx = (lbIdx + d + lbItems.length) % lbItems.length; lbShow(); } }
  function stepTrack(track, d) { track.scrollBy({ left: d * track.clientWidth, behavior: &#x27;smooth&#x27; }); }

  $(&#x27;list&#x27;).addEventListener(&#x27;click&#x27;, function (e) {
    var t = e.target, nav = t.closest ? t.closest(&#x27;.nav&#x27;) : null;

&lt;script&gt;
(function () {
  var KEY = &#x27;schedule-v1&#x27;, FLAG = &#x27;schedule-v1-init&#x27;;
    [&#x27;timetable-v1&#x27;, &#x27;📋 일정표&#x27;],
  var seed = [
    { id: &#x27;s1&#x27;, date: &#x27;2026-10-31&#x27;, title: &#x27;연구실 청소&#x27; },
    { id: &#x27;s2&#x27;, date: &#x27;2026-10-27&#x27;, title: &#x27;구의역에서 교육이수하기&#x27; },
    { id: &#x27;s3&#x27;, date: &#x27;2026-10-20&#x27;, title: &#x27;500W 테스트&#x27; },
    { id: &#x27;s4&#x27;, date: &#x27;2026-10-15&#x27;, title: &#x27;폐시약통 처리&#x27; }
  ];
  var items = [], markerId = null, editId = null, dragging = false;
  var $ = function (id) { return document.getElementById(id); };
  var DAYS = [&#x27;일&#x27;, &#x27;월&#x27;, &#x27;화&#x27;, &#x27;수&#x27;, &#x27;목&#x27;, &#x27;금&#x27;, &#x27;토&#x27;];

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var o = JSON.parse(raw); items = o.items || []; markerId = o.markerId || null; }
      else if (!localStorage.getItem(FLAG)) { items = seed.slice(); localStorage.setItem(FLAG, &#x27;1&#x27;); save(); }
    } catch (e) { if (!items.length) items = seed.slice(); }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ items: items, markerId: markerId })); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function (c) { return { &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; }[c]; }); }
  function pad(n) { return (n &lt; 10 ? &#x27;0&#x27; : &#x27;&#x27;) + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + &#x27;-&#x27; + pad(d.getMonth() + 1) + &#x27;-&#x27; + pad(d.getDate()); }
  function utc(s) { var p = s.split(&#x27;-&#x27;); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function diff(s) { return Math.round((utc(s) - utc(todayStr())) / 86400000); }
  function dow(s) { return DAYS[new Date(utc(s)).getUTCDay()]; }
  function badge(n) {
    if (n === 0) return &#x27;&lt;span class=&quot;diff now&quot;&gt;D-DAY · 오늘&lt;/span&gt;&#x27;;
    if (n &gt; 0) return &#x27;&lt;span class=&quot;diff future&quot;&gt;D-&#x27; + n + &#x27; · &#x27; + n + &#x27;일 뒤&lt;/span&gt;&#x27;;
    return &#x27;&lt;span class=&quot;diff past&quot;&gt;D+&#x27; + (-n) + &#x27; · &#x27; + (-n) + &#x27;일 지남&lt;/span&gt;&#x27;;
  }
  function diffText(n) { return n === 0 ? &#x27;오늘&#x27; : n &gt; 0 ? &#x27;오늘로부터 &#x27; + n + &#x27;일 뒤&#x27; : &#x27;오늘로부터 &#x27; + (-n) + &#x27;일 전&#x27;; }
  function sorted() {
    return items.slice().sort(function (a, b) { return a.date &lt; b.date ? 1 : a.date &gt; b.date ? -1 : 0; });
  }
  function markText() {
    var it = items.filter(function (i) { return i.id === markerId; })[0];
    if (!it) return &#x27;📍 맨 위&#x27;;

  function markHtml() { return &#x27;&lt;div class=&quot;markline&quot; id=&quot;mark&quot;&gt;&lt;span class=&quot;tag&quot; id=&quot;markTag&quot;&gt;&#x27; + markText() + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;; }

  function render() {
    var t = todayStr(), list = sorted();
    var up = list.filter(function (i) { return i.date &gt;= t; }).length;
    $(&#x27;sub&#x27;).textContent = &#x27;오늘 &#x27; + t + &#x27; (&#x27; + dow(t) + &#x27;) · 전체 &#x27; + list.length + &#x27;개 · 오늘 이후 &#x27; + up + &#x27;개 · 분홍 선은 드래그하거나 📍 버튼으로 옮겨요&#x27;;
    if (!items.some(function (i) { return i.id === markerId; })) markerId = null;
    var todayIdx = -1;
    list.forEach(function (i, k) { if (i.date &gt;= t) todayIdx = k; });
    var todayLine = &#x27;&lt;div class=&quot;todayline&quot;&gt;&lt;span&gt;오늘 &#x27; + t + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
    var h = &#x27;&#x27;;
    if (!list.length) { $(&#x27;list&#x27;).innerHTML = &#x27;&lt;div class=&quot;empty&quot;&gt;일정이 없어요. 위에서 추가해 보세요.&lt;/div&gt;&#x27;; return; }
    if (todayIdx === -1) h += todayLine;
    if (markerId === null) h += markHtml();
    list.forEach(function (i, k) {
      var n = diff(i.date);
      h += &#x27;&lt;div class=&quot;row &#x27; + (n &lt; 0 ? &#x27;past&#x27; : &#x27;&#x27;) + &#x27;&quot; data-id=&quot;&#x27; + i.id + &#x27;&quot;&gt;&#x27; +
        &#x27;&lt;div class=&quot;date&quot;&gt;날짜 &lt;b&gt;&#x27; + i.date + &#x27;&lt;/b&gt; (&#x27; + dow(i.date) + &#x27;)&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;title&quot;&gt;&#x27; + esc(i.title) + &#x27;&lt;/div&gt;&#x27; + badge(n) +
        &#x27;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;ghost&quot; data-mk=&quot;&#x27; + i.id + &#x27;&quot; title=&quot;분홍 선을 여기로&quot;&gt;📍&lt;/button&gt;&#x27; +
        &#x27;&lt;button class=&quot;ghost&quot; data-ed=&quot;&#x27; + i.id + &#x27;&quot;&gt;✏️&lt;/button&gt;&#x27; +
        &#x27;&lt;button class=&quot;ghost&quot; data-del=&quot;&#x27; + i.id + &#x27;&quot;&gt;🗑️&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
      if (k === todayIdx) h += todayLine;
      if (i.id === markerId) h += markHtml();

  }

    m.addEventListener(&#x27;pointerup&#x27;, end);
    m.addEventListener(&#x27;pointercancel&#x27;, end);
  }

  $(&#x27;fOk&#x27;).addEventListener(&#x27;click&#x27;, function () {

    if (editId) {
      items.forEach(function (i) { if (i.id === editId) { i.date = d; i.title = tt; } });
    } else {
      items.push({ id: &#x27;i&#x27; + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), date: d, title: tt });
    }

  });
  $(&#x27;fCancel&#x27;).addEventListener(&#x27;click&#x27;, resetForm);

    }
  });

  $(&#x27;fDate&#x27;).value = todayStr();
  load(); render();
  setInterval(function () { if (!dragging) render(); }, 60000);
})();

      &lt;div&gt;&lt;label&gt;브랜치 (비우면 기본)&lt;/label&gt;&lt;input id=&quot;cBranch&quot; type=&quot;text&quot; placeholder=&quot;main&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;button class=&quot;act&quot; id=&quot;bSave&quot;&gt;저장하고 불러오기&lt;/button&gt;
    &lt;div class=&quot;hint&quot;&gt;공개(public) 저장소만 읽을 수 있어요. 폴더 안의 png, jpg, gif, webp, svg 파일을 표시하고, 메모는 파일 이름에 붙어서 이 브라우저에 저장돼요. 사진 파일 이름을 바꾸면 메모가 떨어지니 이름은 유지하는 게 좋아요.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div id=&quot;list&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;orph&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div id=&quot;lb&quot;&gt;&lt;button class=&quot;lbn&quot; id=&quot;lbPrev&quot; aria-label=&quot;이전&quot;&gt;‹&lt;/button&gt;&lt;img id=&quot;lbImg&quot; alt=&quot;&quot;&gt;&lt;button class=&quot;lbn&quot; id=&quot;lbNext&quot; aria-label=&quot;다음&quot;&gt;›&lt;/button&gt;&lt;div id=&quot;lbPos&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;script&gt;
(function () {
  var MKEY = &#x27;space-photo-memo-v1&#x27;, CKEY = &#x27;space-photo-cfg-v1&#x27;, CACHE = &#x27;space-photo-cache-v1&#x27;;
  var $ = function (id) { return document.getElementById(id); };
  var ESC = { &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; };
  function esc(s) { return String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function (c) { return ESC[c]; }); }

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  var cfg = loadCfg(), memos = loadMemos(), files = [];

  function loadCfg() {
    var d = { owner: &#x27;seagull615&#x27;, repo: &#x27;&#x27;, folder: &#x27;space_photos&#x27;, branch: &#x27;&#x27;, sort: &#x27;asc&#x27; };
    try {
      var o = JSON.parse(lsGet(CKEY));

      else {
        var lab = JSON.parse(lsGet(&#x27;lab-photo-cfg-v1&#x27;));
        if (lab &amp;&amp; typeof lab === &#x27;object&#x27;) [&#x27;owner&#x27;, &#x27;repo&#x27;, &#x27;branch&#x27;].forEach(function (k) { if (typeof lab[k] === &#x27;string&#x27;) d[k] = lab[k]; });
      }
    } catch (e) {}
    return d;
  }
  function saveCfg() { lsSet(CKEY, JSON.stringify(cfg)); }
  function loadMemos() {
    var m = {};

      var o = JSON.parse(lsGet(MKEY));
      if (o &amp;&amp; Array.isArray(o.items)) o.items.forEach(function (x) {
        if (x &amp;&amp; typeof x.file === &#x27;string&#x27; &amp;&amp; typeof x.memo === &#x27;string&#x27;) m[x.file] = x.memo;

    return m;
  }
  function saveMemos() {

  function status(t, err) { $(&#x27;status&#x27;).textContent = t || &#x27;&#x27;; $(&#x27;status&#x27;).className = err ? &#x27;err&#x27; : &#x27;&#x27;; }

  function apiUrl() {
    var path = cfg.folder.split(&#x27;/&#x27;).filter(Boolean).map(encodeURIComponent).join(&#x27;/&#x27;);
    var u = &#x27;https://api.github.com/repos/&#x27; + encodeURIComponent(cfg.owner) + &#x27;/&#x27; + encodeURIComponent(cfg.repo) + &#x27;/contents&#x27; + (path ? &#x27;/&#x27; + path : &#x27;&#x27;);
    if (cfg.branch) u += &#x27;?ref=&#x27; + encodeURIComponent(cfg.branch);
    return u;
  }
  function cacheKey() { return cfg.owner + &#x27;/&#x27; + cfg.repo + &#x27;/&#x27; + cfg.folder + &#x27;@&#x27; + cfg.branch; }
  function readCache() { try { return JSON.parse(lsGet(CACHE)); } catch (e) { return null; } }

  function load(force) {
    if (!cfg.owner || !cfg.repo) {
      files = []; render(); $(&#x27;settings&#x27;).classList.add(&#x27;on&#x27;);
      status(&#x27;저장소를 설정해 주세요.&#x27;); return;
    }
    var c = readCache();
    if (!force &amp;&amp; c &amp;&amp; c.key === cacheKey() &amp;&amp; Array.isArray(c.files) &amp;&amp; Date.now() - c.t &lt; 300000) {
      files = c.files; render(); status(&#x27;사진 &#x27; + files.length + &#x27;장 (캐시)&#x27;); return;
    }
    status(&#x27;불러오는 중…&#x27;);
    fetch(apiUrl(), { headers: { &#x27;Accept&#x27;: &#x27;application/vnd.github+json&#x27; } }).then(function (r) {
      if (!r.ok) { var e = new Error(&#x27;http&#x27;); e.code = r.status; throw e; }
      return r.json();
    }).then(function (list) {
      if (!Array.isArray(list)) throw new Error(&#x27;notdir&#x27;);
      files = list.filter(function (f) { return f.type === &#x27;file&#x27; &amp;&amp; /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(f.name); })
                  .map(function (f) { return { name: f.name, url: f.download_url }; });
      lsSet(CACHE, JSON.stringify({ key: cacheKey(), t: Date.now(), files: files }));
      render(); status(&#x27;사진 &#x27; + files.length + &#x27;장&#x27;);
    }).catch(function (e) {
      var msg = &#x27;불러오지 못했어요.&#x27;;
      if (e.code === 404) msg = &#x27;저장소나 폴더를 찾지 못했어요. 이름과 공개 여부를 확인해 주세요.&#x27;;
      else if (e.code === 403) msg = &#x27;GitHub 호출 한도에 걸렸어요. 잠시 후 다시 시도해 주세요.&#x27;;

      var c2 = readCache();
      if (c2 &amp;&amp; c2.key === cacheKey() &amp;&amp; Array.isArray(c2.files)) { files = c2.files; render(); msg += &#x27; (이전에 불러온 목록을 보여줘요)&#x27;; }
      else { files = []; render(); }
      status(msg, true);
    });
  }

  function baseName(n) { return n.replace(/\.[^.]+$/, &#x27;&#x27;); }
  function parseName(n) {
    var b = baseName(n);
    var m = b.match(/^(.*?)[\s_\-]*\(?(\d+)\)?$/);
    if (m &amp;&amp; m[1]) return { key: m[1], num: parseInt(m[2], 10) };
    return { key: b, num: 0 };
  }
  function groups() {
    var map = Object.create(null), order = [];
    files.forEach(function (f) {
      var q = parseName(f.name);
      if (!map[q.key]) { map[q.key] = []; order.push(q.key); }
      map[q.key].push({ f: f, num: q.num });
    });
    order.sort(function (a, b) { return a.localeCompare(b, &#x27;ko&#x27;, { numeric: true }); });
    if (cfg.sort === &#x27;desc&#x27;) order.reverse();
    return order.map(function (k) {
      var items = map[k].sort(function (x, y) { return (x.num - y.num) || x.f.name.localeCompare(y.f.name, &#x27;ko&#x27;, { numeric: true }); })
                        .map(function (x) { return x.f; });
      return { key: k, items: items };
    });
  }

  var curGroups = [];
  function render() {
    var gs = curGroups = groups(), h = &#x27;&#x27;;
    if (!gs.length) {
      h = &#x27;&lt;div class=&quot;empty&quot;&gt;&#x27; + (cfg.repo ? &#x27;GitHub 폴더에 사진이 없어요.&lt;br&gt;사진을 올리고 🔄 새로고침을 눌러 보세요.&#x27; : &#x27;⚙️ 저장소 설정에서 저장소와 폴더를 지정하면&lt;br&gt;그 폴더의 사진이 여기에 나타나요.&#x27;) + &#x27;&lt;/div&gt;&#x27;;
    }
    gs.forEach(function (g, gi) {
      var n = g.items.length;
      h += &#x27;&lt;div class=&quot;card&quot; data-g=&quot;&#x27; + gi + &#x27;&quot;&gt;&lt;div class=&quot;ghead&quot;&gt;&lt;h3&gt;&#x27; + esc(n &gt; 1 ? g.key : baseName(g.items[0].name)) + &#x27;&lt;/h3&gt;&#x27; +
        (n &gt; 1 ? &#x27;&lt;span class=&quot;pos&quot;&gt;1 / &#x27; + n + &#x27;&lt;/span&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/div&gt;&lt;div class=&quot;trackwrap&quot;&gt;&#x27; +
        (n &gt; 1 ? &#x27;&lt;button class=&quot;nav prev&quot; data-d=&quot;-1&quot; aria-label=&quot;이전&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;nav next&quot; data-d=&quot;1&quot; aria-label=&quot;다음&quot;&gt;›&lt;/button&gt;&#x27; : &#x27;&#x27;) +
        &#x27;&lt;div class=&quot;track&quot; tabindex=&quot;0&quot;&gt;&#x27;;
      g.items.forEach(function (f, i) {
        h += &#x27;&lt;div class=&quot;slide&quot;&gt;&lt;img loading=&quot;lazy&quot; src=&quot;&#x27; + esc(f.url) + &#x27;&quot; alt=&quot;&#x27; + esc(f.name) + &#x27;&quot; data-i=&quot;&#x27; + i + &#x27;&quot;&gt;&#x27; +
          (n &gt; 1 ? &#x27;&lt;div class=&quot;cap&quot;&gt;&#x27; + esc(baseName(f.name)) + &#x27;&lt;/div&gt;&#x27; : &#x27;&#x27;) +
          &#x27;&lt;div class=&quot;eq&quot; data-f=&quot;&#x27; + esc(f.name) + &#x27;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
      });
      h += &#x27;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
    });
    $(&#x27;list&#x27;).innerHTML = h;
    $(&#x27;list&#x27;).querySelectorAll(&#x27;textarea&#x27;).forEach(fit);
    refreshAllEq();
    var names = {}; files.forEach(function (f) { names[f.name] = 1; });
    var orph = [];
    $(&#x27;orph&#x27;).innerHTML = (files.length &amp;&amp; orph.length)
      ? &#x27;&lt;details class=&quot;orph&quot;&gt;&lt;summary&gt;사진이 없는 메모 &#x27; + orph.length + &#x27;개&lt;/summary&gt;&#x27; +
        orph.map(function (k) { return &#x27;&lt;div&gt;&lt;b&gt;&#x27; + esc(k) + &#x27;&lt;/b&gt;\n&#x27; + hlHtml(memos[k]) + &#x27;&lt;/div&gt;&#x27;; }).join(&#x27;&#x27;) + &#x27;&lt;/details&gt;&#x27;
      : &#x27;&#x27;;
  }
  function fit(t) { t.style.height = &#x27;auto&#x27;; t.style.height = Math.max(64, t.scrollHeight + 2) + &#x27;px&#x27;; }

  var timer = null;
  $(&#x27;list&#x27;).addEventListener(&#x27;input&#x27;, function (e) {
    var t = e.target; if (t.tagName !== &#x27;TEXTAREA&#x27; || t.classList.contains(&#x27;eqspec&#x27;)) return;
    fit(t); memos[t.dataset.f] = t.value;
    var hl = t.previousElementSibling; if (hl) hl.innerHTML = hlHtml(t.value) + (/\n$/.test(t.value) ? &#x27; &#x27; : &#x27;&#x27;);
    clearTimeout(timer);
    timer = setTimeout(function () { status(saveMemos() ? &#x27;메모 저장됨&#x27; : &#x27;메모 저장 실패&#x27;, false); }, 400);
  });
  document.addEventListener(&#x27;error&#x27;, function (e) {
    var t = e.target;
    if (t &amp;&amp; t.tagName === &#x27;IMG&#x27; &amp;&amp; t.parentNode &amp;&amp; t.id !== &#x27;lbImg&#x27;) {
      var d = document.createElement(&#x27;div&#x27;); d.className = &#x27;imgerr&#x27;; d.textContent = &#x27;사진을 불러오지 못했어요.&#x27;;
      t.parentNode.replaceChild(d, t);
    }
  }, true);

  var lbItems = [], lbIdx = 0;
  function lbShow() {
    $(&#x27;lbImg&#x27;).src = lbItems[lbIdx].url;
    var multi = lbItems.length &gt; 1;
    $(&#x27;lbPos&#x27;).textContent = multi ? (lbIdx + 1) + &#x27; / &#x27; + lbItems.length : &#x27;&#x27;;
    $(&#x27;lbPrev&#x27;).style.display = multi ? &#x27;&#x27; : &#x27;none&#x27;;
    $(&#x27;lbNext&#x27;).style.display = multi ? &#x27;&#x27; : &#x27;none&#x27;;
  }
  function lbStep(d) { if (lbItems.length &gt; 1) { lbIdx = (lbIdx + d + lbItems.length) % lbItems.length; lbShow(); } }
  function stepTrack(track, d) { track.scrollBy({ left: d * track.clientWidth, behavior: &#x27;smooth&#x27; }); }

  $(&#x27;list&#x27;).addEventListener(&#x27;click&#x27;, function (e) {
    var t = e.target, nav = t.closest ? t.closest(&#x27;.nav&#x27;) : null;
    if (nav) { stepTrack(nav.closest(&#x27;.card&#x27;).querySelector(&#x27;.track&#x27;), parseInt(nav.dataset.d, 10)); return; }
    if (t.tagName === &#x27;IMG&#x27;) {
      var g = curGroups[parseInt(t.closest(&#x27;.card&#x27;).dataset.g, 10)];
      if (!g) return;
      lbItems = g.items; lbIdx = parseInt(t.dataset.i, 10) || 0; lbShow(); $(&#x27;lb&#x27;).classList.add(&#x27;on&#x27;);
    }
  });
  document.addEventListener(&#x27;scroll&#x27;, function (e) { var t = e.target; if (t &amp;&amp; t.tagName === &#x27;TEXTAREA&#x27; &amp;&amp; t.previousElementSibling) t.previousElementSibling.scrollTop = t.scrollTop; }, true);
  document.addEventListener(&#x27;scroll&#x27;, function (e) {
    var t = e.target;
    if (!t || !t.classList || !t.classList.contains(&#x27;track&#x27;)) return;
    var pos = t.closest(&#x27;.card&#x27;).querySelector(&#x27;.pos&#x27;); if (!pos) return;
    var n = t.children.length, i = Math.min(n - 1, Math.round(t.scrollLeft / Math.max(1, t.clientWidth)));
    pos.textContent = (i + 1) + &#x27; / &#x27; + n;
  }, true);

  $(&#x27;lb&#x27;).addEventListener(&#x27;click&#x27;, function () { $(&#x27;lb&#x27;).classList.remove(&#x27;on&#x27;); });
  $(&#x27;lbPrev&#x27;).addEventListener(&#x27;click&#x27;, function (e) { e.stopPropagation(); lbStep(-1); });
  $(&#x27;lbNext&#x27;).addEventListener(&#x27;click&#x27;, function (e) { e.stopPropagation(); lbStep(1); });
  document.addEventListener(&#x27;keydown&#x27;, function (e) {
    if ($(&#x27;lb&#x27;).classList.contains(&#x27;on&#x27;)) {
      if (e.key === &#x27;Escape&#x27;) $(&#x27;lb&#x27;).classList.remove(&#x27;on&#x27;);
      else if (e.key === &#x27;ArrowLeft&#x27;) lbStep(-1);
      else if (e.key === &#x27;ArrowRight&#x27;) lbStep(1);

    if (t &amp;&amp; t.classList &amp;&amp; t.classList.contains(&#x27;track&#x27;) &amp;&amp; (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;)) {
      e.preventDefault(); stepTrack(t, e.key === &#x27;ArrowLeft&#x27; ? -1 : 1);
    }
  });

  $(&#x27;bGear&#x27;).addEventListener(&#x27;click&#x27;, function () { $(&#x27;settings&#x27;).classList.toggle(&#x27;on&#x27;); });
  $(&#x27;bRef&#x27;).addEventListener(&#x27;click&#x27;, function () { load(true); });
  $(&#x27;sSort&#x27;).addEventListener(&#x27;change&#x27;, function () { cfg.sort = $(&#x27;sSort&#x27;).value; saveCfg(); render(); });
  $(&#x27;bSave&#x27;).addEventListener(&#x27;click&#x27;, function () {
    cfg.owner = $(&#x27;cOwner&#x27;).value.trim(); cfg.repo = $(&#x27;cRepo&#x27;).value.trim();
    cfg.folder = $(&#x27;cFolder&#x27;).value.trim(); cfg.branch = $(&#x27;cBranch&#x27;).value.trim();
    saveCfg(); $(&#x27;settings&#x27;).classList.remove(&#x27;on&#x27;); load(true);
  });

  var EKEY = &#x27;space-photo-equip-v1&#x27;;
  var eq = loadEq(), ed = null;
  function loadEq() {
    var r = { photos: {}, specs: {} };
    try {
      var o = JSON.parse(lsGet(EKEY));
      if (o &amp;&amp; Array.isArray(o.items)) o.items.forEach(function (x) {
        if (x &amp;&amp; typeof x.file === &#x27;string&#x27; &amp;&amp; Array.isArray(x.eq)) r.photos[x.file] = x.eq.filter(function (n) { return typeof n === &#x27;string&#x27; &amp;&amp; n; });
      });
      if (o &amp;&amp; o.specs &amp;&amp; typeof o.specs === &#x27;object&#x27;) for (var k in o.specs) if (typeof o.specs[k] === &#x27;string&#x27;) r.specs[k] = o.specs[k];
    } catch (e) {}
    return r;
  }
  function pruneEq() {
    var used = {};
    Object.keys(eq.photos).forEach(function (f) { eq.photos[f].forEach(function (n) { used[n] = 1; }); });
    Object.keys(eq.specs).forEach(function (n) { if (!used[n] || !eq.specs[n].trim()) delete eq.specs[n]; });
  }
  function saveEq() {
    pruneEq();
    var items = [];
    Object.keys(eq.photos).forEach(function (f) { if (eq.photos[f].length) items.push({ file: f, eq: eq.photos[f] }); });
    return lsSet(EKEY, JSON.stringify({ items: items, specs: eq.specs }));
  }

  var dl = document.createElement(&#x27;datalist&#x27;); dl.id = &#x27;eqlist&#x27;; document.body.appendChild(dl);
  var tip = document.createElement(&#x27;div&#x27;); tip.id = &#x27;tip&#x27;; document.body.appendChild(tip);
  function updateDl() {
    var seen = {}, h = &#x27;&#x27;;
    Object.keys(eq.photos).forEach(function (f) { eq.photos[f].forEach(function (n) { if (!seen[n]) { seen[n] = 1; h += &#x27;&lt;option value=&quot;&#x27; + esc(n) + &#x27;&quot;&gt;&#x27;; } }); });
    dl.innerHTML = h;
  }

  function eqHtml(f) {
    var list = eq.photos[f] || [], h = &#x27;&lt;div class=&quot;eqrow&quot;&gt;&#x27;;
    list.forEach(function (n, i) {
      var has = !!(eq.specs[n] || &#x27;&#x27;).trim(), on = ed &amp;&amp; ed.f === f &amp;&amp; ed.i === i;
      h += &#x27;&lt;span draggable=&quot;true&quot; class=&quot;chip&#x27; + (has ? &#x27;&#x27; : &#x27; nospec&#x27;) + (on ? &#x27; on&#x27; : &#x27;&#x27;) + &#x27;&quot; data-i=&quot;&#x27; + i + &#x27;&quot; data-n=&quot;&#x27; + esc(n) + &#x27;&quot;&gt;&#x27; + esc(n) + &#x27;&lt;/span&gt;&#x27;;
    });
    h += &#x27;&lt;button type=&quot;button&quot; class=&quot;chip addeq&quot;&gt;＋ 장비명&lt;/button&gt;&lt;/div&gt;&#x27;;
    if (ed &amp;&amp; ed.f === f) {
      var nm = ed.i &gt;= 0 ? (list[ed.i] || &#x27;&#x27;) : &#x27;&#x27;;
      h += &#x27;&lt;div class=&quot;eqed&quot;&gt;&lt;input class=&quot;eqname&quot; type=&quot;text&quot; list=&quot;eqlist&quot; autocomplete=&quot;off&quot; placeholder=&quot;장비명&quot; value=&quot;&#x27; + esc(nm) + &#x27;&quot;&gt;&#x27; +
        &#x27;&lt;textarea class=&quot;eqspec&quot; placeholder=&quot;스펙을 적어 주세요. 줄마다 &amp;quot;항목: 값&amp;quot; 으로 쓰면 항목이 굵게 보여요.&amp;#10;예)&amp;#10;모델: …&amp;#10;파장: …&quot;&gt;&#x27; + esc(ed.i &gt;= 0 ? (eq.specs[nm] || &#x27;&#x27;) : &#x27;&#x27;) + &#x27;&lt;/textarea&gt;&#x27; +
        &#x27;&lt;div class=&quot;btns&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;act&quot; data-act=&quot;save&quot;&gt;확인&lt;/button&gt;&lt;button type=&quot;button&quot; data-act=&quot;cancel&quot;&gt;취소&lt;/button&gt;&lt;span class=&quot;sp&quot;&gt;&lt;/span&gt;&#x27; +
        (ed.i &gt;= 0 ? &#x27;&lt;button type=&quot;button&quot; class=&quot;danger&quot; data-act=&quot;del&quot;&gt;이 사진에서 삭제&lt;/button&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
    }
    return h;

&lt;script&gt;
(function () {
  var KEY = &#x27;timetable-v1&#x27;;
  var FONT = &#x27;-apple-system,&quot;Apple SD Gothic Neo&quot;,&quot;Noto Sans KR&quot;,&quot;Malgun Gothic&quot;,sans-serif&#x27;;
  var DAYS = [&#x27;일&#x27;, &#x27;월&#x27;, &#x27;화&#x27;, &#x27;수&#x27;, &#x27;목&#x27;, &#x27;금&#x27;, &#x27;토&#x27;];
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/&amp;/g, &#x27;&amp;amp;&#x27;).replace(/&lt;/g, &#x27;&amp;lt;&#x27;).replace(/&gt;/g, &#x27;&amp;gt;&#x27;).replace(/&quot;/g, &#x27;&amp;quot;&#x27;); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function todayTitle() { var d = new Date(); return (d.getMonth() + 1) + &#x27;월 &#x27; + d.getDate() + &#x27;일 (&#x27; + DAYS[d.getDay()] + &#x27;) 일정표&#x27;; }
  function uid() { return &#x27;t&#x27; + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function blankRows() { return [{ t: &#x27;&#x27;, c: &#x27;&#x27; }, { t: &#x27;&#x27;, c: &#x27;&#x27; }, { t: &#x27;&#x27;, c: &#x27;&#x27; }]; }
  function validCard(x) { return x &amp;&amp; typeof x.id === &#x27;string&#x27; &amp;&amp; Array.isArray(x.rows); }

  var items = [], cur = null;

    try {

      if (o &amp;&amp; Array.isArray(o.items)) items = o.items.filter(validCard);

  function fit(ta) { ta.style.height = &#x27;auto&#x27;; ta.style.height = ta.scrollHeight + &#x27;px&#x27;; }

    $(&#x27;title&#x27;).value = cur.title;
    $(&#x27;editLabel&#x27;).textContent = cur.id ? &#x27;카드 수정 중&#x27; : &#x27;새 일정표&#x27;;
    var h = &#x27;&#x27;;
    cur.rows.forEach(function (r, i) {
      h += &#x27;&lt;div class=&quot;er&quot; data-i=&quot;&#x27; + i + &#x27;&quot;&gt;&lt;div class=&quot;no&quot;&gt;&#x27; + (i + 1) + &#x27;&lt;/div&gt;&#x27; +
        &#x27;&lt;input class=&quot;tm&quot; type=&quot;text&quot; placeholder=&quot;09:00&quot; value=&quot;&#x27; + esc(r.t) + &#x27;&quot;&gt;&#x27; +
        &#x27;&lt;textarea class=&quot;ct&quot; rows=&quot;1&quot; placeholder=&quot;일정 내용&quot;&gt;&#x27; + esc(r.c) + &#x27;&lt;/textarea&gt;&#x27; +
        &#x27;&lt;button type=&quot;button&quot; class=&quot;rm&quot; title=&quot;이 줄 삭제&quot;&gt;×&lt;/button&gt;&lt;/div&gt;&#x27;;
    });
    $(&#x27;rows&#x27;).innerHTML = h;
    var tas = $(&#x27;rows&#x27;).querySelectorAll(&#x27;textarea&#x27;); for (var k = 0; k &lt; tas.length; k++) fit(tas[k]);
    if (fi !== undefined &amp;&amp; fi !== null) {
      var row = $(&#x27;rows&#x27;).querySelector(&#x27;.er[data-i=&quot;&#x27; + fi + &#x27;&quot;]&#x27;);
      var el = row &amp;&amp; row.querySelector(fc === &#x27;c&#x27; ? &#x27;.ct&#x27; : &#x27;.tm&#x27;); if (el) el.focus();
    }
  }
  function addRow(at) {
    var i = (at === undefined) ? cur.rows.length : at;
    cur.rows.splice(i, 0, { t: &#x27;&#x27;, c: &#x27;&#x27; });

  }

  $(&#x27;title&#x27;).addEventListener(&#x27;input&#x27;, function () { cur.title = this.value; persist(); });
  $(&#x27;rows&#x27;).addEventListener(&#x27;input&#x27;, function (e) {
    var row = e.target.closest ? e.target.closest(&#x27;.er&#x27;) : null; if (!row) return;
    var i = parseInt(row.dataset.i, 10), r = cur.rows[i]; if (!r) return;
    if (e.target.classList.contains(&#x27;tm&#x27;)) r.t = e.target.value;
    else if (e.target.classList.contains(&#x27;ct&#x27;)) { r.c = e.target.value; fit(e.target); }

  $(&#x27;rows&#x27;).addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key !== &#x27;Enter&#x27; || e.isComposing || e.keyCode === 229 || e.shiftKey) return;

  $(&#x27;rows&#x27;).addEventListener(&#x27;click&#x27;, function (e) {
    var b = e.target.closest ? e.target.closest(&#x27;.rm&#x27;) : null; if (!b) return;
    var i = parseInt(b.closest(&#x27;.er&#x27;).dataset.i, 10);
    if (cur.rows.length &lt;= 1) cur.rows[0] = { t: &#x27;&#x27;, c: &#x27;&#x27; }; else cur.rows.splice(i, 1);
    persist(); renderEditor();
  });
  $(&#x27;bAdd&#x27;).addEventListener(&#x27;click&#x27;, function () { addRow(); });
  $(&#x27;bAddTop&#x27;).addEventListener(&#x27;click&#x27;, function () { addRow(0); });
  $(&#x27;bNew&#x27;).addEventListener(&#x27;click&#x27;, function () {
    var has = cur.rows.some(function (r) { return r.t.trim() || r.c.trim(); });
    if (has &amp;&amp; !confirm(&#x27;지금 쓰던 내용을 지우고 새로 시작할까요?&#x27;)) return;

    if (!rows.length) { say(&#x27;시간이나 일정 내용을 한 줄 이상 적어 주세요.&#x27;, true); return; }
    var id = cur.id || uid(), idx = -1;
    for (var k = 0; k &lt; items.length; k++) if (items[k].id === id) idx = k;

  });

  function fmtTs(ts) {

  function renderCards() {

        &#x27;&lt;table class=&quot;tb&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;번호&lt;/th&gt;&lt;th&gt;시간&lt;/th&gt;&lt;th&gt;일정&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27; + body + &#x27;&lt;/tbody&gt;&lt;/table&gt;&#x27; +
        &#x27;&lt;div class=&quot;cb&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;act&quot; data-a=&quot;copy&quot;&gt;🖼️ 이미지 복사&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ghost&quot; data-a=&quot;edit&quot;&gt;✏️ 수정&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;ghost del&quot; data-a=&quot;del&quot;&gt;🗑 삭제&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
    }).join(&#x27;&#x27;);
  }

  /* ---- 카드 → 이미지 ---- */

&lt;script&gt;
(function () {
  var KEY = &#x27;person-cards-v1&#x27;;
  var FIELDS = [
    { k: &#x27;dept&#x27;, label: &#x27;소속&#x27;, ph: &#x27;소속&#x27; },
    { k: &#x27;contact&#x27;, label: &#x27;이메일&#x27;, ph: &#x27;name@example.com&#x27; }

  var cards = [];
  var saveTimer = null;

  function load() {

  }

  function save() {

    } catch (e) {
      toast(&#x27;브라우저 저장 공간이 가득 찼습니다. 백업 내보내기 후 오래된 카드를 지워주세요.&#x27;);

  }
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }

      for (var i = 0; i &lt; localStorage.length; i++) {

      }

    } catch (e) {}
    document.getElementById(&#x27;meta&#x27;).textContent = &#x27;카드 &#x27; + cards.length + &#x27;장 · 모든 탭 합친 저장 용량 약 &#x27; + kb + &#x27;KB / 5,000KB&#x27;;
  }

  function toast(msg) {

  /* 이미지 -&gt; 축소한 JPEG data URL */
  function shrink(file) {
    return new Promise(function (resolve, reject) {

        var f = items[i].getAsFile();

      });

      } else {
        cards.splice(0, imgs.length);
      }
    }).catch(function () { toast(&#x27;이미지를 읽지 못했습니다. 캡처 방식으로 다시 복사해 보세요.&#x27;); });
  });

  function bind(el, card, key) {

    el.addEventListener(&#x27;input&#x27;, function () { card[key] = el.value; saveSoon(); });
  }

  function copyText(txt) {
    if (!txt.trim()) return;
    var done = function () { toast(&#x27;제목을 복사했습니다.&#x27;); };

  function paperBlock(c) {

    var h = document.createElement(&#x27;div&#x27;); h.className = &#x27;papers-h&#x27;; h.textContent = &#x27;이 사람이 푸는 문제&#x27;;

      ta.addEventListener(&#x27;input&#x27;, function () { c.papers[idx] = ta.value; fit(); saveSoon(); });
      ta.addEventListener(&#x27;paste&#x27;, function (e) {

      });

      var act = document.createElement(&#x27;div&#x27;); act.className = &#x27;pact&#x27;;
      var bc = document.createElement(&#x27;button&#x27;); bc.type = &#x27;button&#x27;; bc.textContent = &#x27;복사&#x27;;

      var bs = document.createElement(&#x27;button&#x27;); bs.type = &#x27;button&#x27;; bs.textContent = &#x27;검색&#x27;;
      bs.title = &#x27;Google Scholar에서 이 제목 검색&#x27;;

      });
      var bd = document.createElement(&#x27;button&#x27;); bd.type = &#x27;button&#x27;; bd.className = &#x27;pdel&#x27;; bd.textContent = &#x27;삭제&#x27;;

    var add = document.createElement(&#x27;button&#x27;); add.type = &#x27;button&#x27;; add.className = &#x27;padd&#x27;; add.textContent = &#x27;+ 논문 제목 추가&#x27;;

    return box;
  }

  function render() {

    grid.innerHTML = &#x27;&#x27;;
    if (!cards.length) {

      em.className = &#x27;empty&#x27;;

      var del = document.createElement(&#x27;button&#x27;);
      del.className = &#x27;del&#x27;; del.type = &#x27;button&#x27;; del.textContent = &#x27;×&#x27;; del.title = &#x27;카드 삭제&#x27;; del.setAttribute(&#x27;aria-label&#x27;, &#x27;카드 삭제&#x27;);

        cards = cards.filter(function (x) { return x.id !== c.id; });
        save(); render();
      });
      el.appendChild(del);

      var ph = document.createElement(&#x27;div&#x27;); ph.className = &#x27;photo&#x27;;
      var im = document.createElement(&#x27;img&#x27;); im.src = c.img; im.alt = c.name || &#x27;인물 사진&#x27;;

      var t = document.createElement(&#x27;input&#x27;);

      bind(t, c, &#x27;title&#x27;); el.appendChild(t);

      var rows = document.createElement(&#x27;div&#x27;); rows.className = &#x27;rows&#x27;;
      FIELDS.forEach(function (f) {
        var r = document.createElement(&#x27;div&#x27;); r.className = &#x27;row&#x27;;
        var l = document.createElement(&#x27;label&#x27;); l.textContent = f.label;
        var i = document.createElement(&#x27;input&#x27;); i.placeholder = f.ph; i.setAttribute(&#x27;aria-label&#x27;, f.label);

      });
      var mr = document.createElement(&#x27;div&#x27;); mr.className = &#x27;row memo&#x27;;
      var ml = document.createElement(&#x27;label&#x27;); ml.textContent = &#x27;메모&#x27;;
      var mt = document.createElement(&#x27;textarea&#x27;); mt.rows = 2; mt.placeholder = &#x27;메모&#x27;; mt.setAttribute(&#x27;aria-label&#x27;, &#x27;메모&#x27;);
      bind(mt, c, &#x27;memo&#x27;);

      el.appendChild(rows);
      el.appendChild(paperBlock(c));

    updateMeta();
  }

  /* 백업 */
  document.getElementById(&#x27;btnExport&#x27;).addEventListener(&#x27;click&#x27;, function () {
    var blob = new Blob([JSON.stringify(cards)], { type: &#x27;application/json&#x27; });

})();

&lt;div class=&quot;wrap&quot;&gt;
  &lt;h1&gt;💡 Tip / 힌트&lt;/h1&gt;

&lt;script&gt;
(function () {

  var editing = null;

  function load() {

  function uid() { return &#x27;t&#x27; + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function whos() {

  }

  function render() {

    $(&#x27;whoList&#x27;).innerHTML = ws.map(function (w) { return &#x27;&lt;option value=&quot;&#x27; + esc(w) + &#x27;&quot;&gt;&#x27;; }).join(&#x27;&#x27;);
    var ch = &#x27;&lt;button class=&quot;tab&#x27; + (filter === &#x27;all&#x27; ? &#x27; on&#x27; : &#x27;&#x27;) + &#x27;&quot; data-f=&quot;all&quot;&gt;전체 &#x27; + items.length + &#x27;&lt;/button&gt;&#x27;;
    ws.forEach(function (w) {

    });

    var shown = items.filter(function (x) {
      var w = (x.who || &#x27;&#x27;).trim();

    });
    if (!shown.length) { $(&#x27;list&#x27;).innerHTML = &#x27;&lt;div class=&quot;empty&quot;&gt;&#x27; + (items.length ? &#x27;해당 출처人의 팁이 없어요.&#x27; : &#x27;아직 팁이 없어요. 위에서 첫 팁을 추가해보세요.&#x27;) + &#x27;&lt;/div&gt;&#x27;; return; }

  }

  $(&#x27;bExp&#x27;).addEventListener(&#x27;click&#x27;, function () {
    var data = {};
    KEYS.forEach(function (p) {
      var raw = get(p[0]); if (raw === null) return;
      try { data[p[0]] = JSON.parse(raw); } catch (e) { data[p[0]] = raw; }
    });
    var out = { app: APP, version: 1, exported: new Date().toISOString(), data: data };
    var blob = new Blob([JSON.stringify(out, null, 2)], { type: &#x27;application/json&#x27; });
    var d = new Date(), pad = function (n) { return (n &lt; 10 ? &#x27;0&#x27; : &#x27;&#x27;) + n; };
    var name = APP + &#x27;_&#x27; + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + &#x27;.json&#x27;;
    var a = document.createElement(&#x27;a&#x27;);
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    say(&#x27;내보냈어요: &#x27; + name);
  });

  $(&#x27;bImp&#x27;).addEventListener(&#x27;click&#x27;, function () { $(&#x27;file&#x27;).value = &#x27;&#x27;; $(&#x27;file&#x27;).click(); });
  $(&#x27;file&#x27;).addEventListener(&#x27;change&#x27;, function () {
    var f = $(&#x27;file&#x27;).files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var o;
      try { o = JSON.parse(r.result); } catch (e) { say(&#x27;JSON 형식이 아니에요.&#x27;, true); return; }
      if (!o || o.app !== APP || !o.data || typeof o.data !== &#x27;object&#x27;) { say(&#x27;이 앱에서 내보낸 파일이 아니에요.&#x27;, true); return; }
      var ks = KEYS.map(function (p) { return p[0]; }).filter(function (k) { return k in o.data; });
      if (!ks.length) { say(&#x27;불러올 데이터가 없어요.&#x27;, true); return; }
      if (!confirm(&#x27;파일의 데이터로 현재 데이터를 덮어쓸까요? (&#x27; + ks.length + &#x27;개 항목)&#x27;)) return;
      try {
        ks.forEach(function (k) { localStorage.setItem(k, JSON.stringify(o.data[k])); });
      } catch (e) { say(&#x27;저장에 실패했어요.&#x27;, true); return; }
      renderTbl();
      try {
        var self = window.frameElement;
        parent.document.querySelectorAll(&#x27;iframe.pane&#x27;).forEach(function (fr) {
          if (fr === self) return;
          var s = fr.srcdoc; fr.srcdoc = &#x27;&#x27;; fr.srcdoc = s;
        });
        say(&#x27;불러왔어요. 다른 탭에 바로 반영됐어요.&#x27;);
      } catch (e) { say(&#x27;불러왔어요. 페이지를 새로고침하면 반영돼요.&#x27;); }
    };
    r.readAsText(f);
  });

  renderTbl();
})();

<script>
(function () {
  var K = 'mate-active-tab';
  var tabs = document.querySelectorAll('.toptab');
  function show(t) {
    tabs.forEach(function (b) { b.classList.toggle('on', b.dataset.t === t); });
    var isPhoto = (t === 'photo');
    document.getElementById('panes').classList.toggle('split', isPhoto);
    document.querySelectorAll('.pane').forEach(function (p) { p.classList.toggle('on', isPhoto ? false : p.id === 'p-' + t); });
    try { localStorage.setItem(K, t); } catch (e) {}
    if (t === 'people') { try { document.getElementById('p-people').contentWindow.focus(); } catch (e) {} }
  }
  tabs.forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.t); }); });
  (function () {
    var SK = 'photo-split-v1', box = document.getElementById('panes'), bar = document.getElementById('vsplit');
    function setSplit(p) { p = Math.max(20, Math.min(80, p)); box.style.setProperty('--split', p + '%'); return p; }
    try { var v = parseFloat(localStorage.getItem(SK)); if (v) setSplit(v); } catch (e) {}
    var cur = null;
    bar.addEventListener('pointerdown', function (e) { bar.setPointerCapture(e.pointerId); bar.classList.add('drag'); box.classList.add('dragging'); e.preventDefault(); });
    bar.addEventListener('pointermove', function (e) {
      if (!bar.classList.contains('drag')) return;
      var r = box.getBoundingClientRect();
      cur = setSplit((e.clientX - r.left) / r.width * 100);
    });
    function end() { bar.classList.remove('drag'); box.classList.remove('dragging'); if (cur !== null) { try { localStorage.setItem(SK, String(cur)); } catch (e) {} } }
    bar.addEventListener('pointerup', end);
    bar.addEventListener('pointercancel', end);
    bar.addEventListener('dblclick', function () { cur = setSplit(50); try { localStorage.setItem(SK, '50'); } catch (e) {} });
  })();
  var saved = null;
  try { saved = localStorage.getItem(K); } catch (e) {}
  if (saved === 'labphoto' || saved === 'spacephoto') saved = 'photo';
  if (saved === 'graph' || saved === 'work' || saved === 'photo' || saved === 'schedule' || saved === 'timetable' || saved === 'menu' || saved === 'sales' || saved === 'people' || saved === 'tip' || saved === 'novelty' || saved === 'data') show(saved);
})();

<script>
(function () {
  var tip = document.createElement('div'); tip.id = 'ftip'; document.body.appendChild(tip);
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function tipHtml(n, spec) {
    var h = '<div class="tn">' + esc(n) + '</div>';
    spec = (spec || '').trim();
    if (!spec) return h + '<div class="tnone">상세가 아직 없어요. 클릭해서 입력하세요.</div>';
    return h + spec.split(/\n/).map(function (line) {
      var m = line.match(/^\s*([^:：]{1,24})[:：]\s*(.*)$/);
      return m ? '<div class="tl"><b>' + esc(m[1]) + '</b>' + esc(m[2]) + '</div>' : '<div class="tl">' + esc(line) + '</div>';
    }).join('');
  }
  function showTip(chip, spec) {
    tip.innerHTML = tipHtml(chip.dataset.n, spec); tip.style.display = 'block';
    var r = chip.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    var x = Math.max(8, Math.min(r.left, window.innerWidth - tw - 8));
    var y = r.bottom + 6;
    if (y + th > window.innerHeight - 8) y = Math.max(8, r.top - th - 6);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  function hideTip() { tip.style.display = 'none'; }
  document.addEventListener('scroll', hideTip, true);

  function initFocus(cfg) {
    var KEY = cfg.key;
    var bar = document.getElementById(cfg.barId);
    var list = document.getElementById(cfg.listId);
    var data = load();
    var items = data.items, specs = data.specs;
    var ed = null;      // { i: index or -1 }
    var drag = null;

    function load() {
      var r = { items: cfg.defaults.slice(), specs: {} };
      try {
        var raw = localStorage.getItem(KEY);
        if (raw === null) return r;
        var o = JSON.parse(raw);
        if (o && Array.isArray(o.items)) r.items = o.items.filter(function (x) { return typeof x === 'string' && x; });
        if (o && o.specs && typeof o.specs === 'object') for (var k in o.specs) if (typeof o.specs[k] === 'string') r.specs[k] = o.specs[k];
      } catch (e) {}
      return r;
    }
    function prune() {
      var used = {}; items.forEach(function (n) { used[n] = 1; });
      Object.keys(specs).forEach(function (n) { if (!used[n] || !specs[n].trim()) delete specs[n]; });
    }
    function save() { prune(); try { localStorage.setItem(KEY, JSON.stringify({ items: items, specs: specs })); } catch (e) {} }

    function closePop() { var p = bar.querySelector('.fpop'); if (p) p.remove(); }
    function openPop(chipEl, i) {
      closePop();
      var name = i >= 0 ? items[i] : '';
      var pop = document.createElement('div'); pop.className = 'fpop';
      pop.innerHTML =
        '<input class="fname" type="text" maxlength="60" autocomplete="off" placeholder="' + esc(cfg.placeholder) + '" value="' + esc(name) + '">' +
        '<textarea class="fspec" placeholder="상세를 적어 주세요. 줄마다 &quot;항목: 값&quot; 으로 쓰면 항목이 굵게 보여요.&#10;예)&#10;목표: …&#10;기한: …"></textarea>' +
        '<div class="pb"><button type="button" class="act" data-act="save">확인</button><button type="button" data-act="cancel">취소</button><span class="sp"></span>' +
        (i >= 0 ? '<button type="button" class="danger" data-act="del">삭제</button>' : '') + '</div>';
      pop.querySelector('.fspec').value = i >= 0 ? (specs[name] || '') : '';
      bar.appendChild(pop);
      var br = bar.getBoundingClientRect(), cr = chipEl.getBoundingClientRect();
      var left = Math.max(14, Math.min(cr.left - br.left, br.width - pop.offsetWidth - 14));
      pop.style.left = left + 'px';
      var inp = pop.querySelector('.fname'); inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {}
    }
    function commit() {
      var pop = bar.querySelector('.fpop'); if (!pop || !ed) return;
      var nm = pop.querySelector('.fname').value.replace(/\s+/g, ' ').trim();
      var sp = pop.querySelector('.fspec').value.replace(/\s+$/, '');
      if (!nm) { if (ed.i >= 0) items.splice(ed.i, 1); }
      else {
        if (ed.i >= 0) { if (items[ed.i] !== nm) delete specs[items[ed.i]]; items[ed.i] = nm; } else items.push(nm);
        if (sp.trim()) specs[nm] = sp; else delete specs[nm];
        items = items.filter(function (n, k) { return items.indexOf(n) === k; });
      }
      ed = null; save(); render();
    }
    function cancel() { ed = null; render(); }

    function render() {
      closePop(); hideTip();
      list.textContent = '';
      items.forEach(function (n, i) {
        var chip = document.createElement('span');
        chip.className = 'fchip' + ((specs[n] || '').trim() ? '' : ' nospec') + (ed && ed.i === i ? ' on' : '');
        chip.draggable = true; chip.dataset.i = i; chip.dataset.n = n; chip.textContent = n;
        list.appendChild(chip);
      });
      var add = document.createElement('button'); add.type = 'button'; add.className = 'fadd'; add.textContent = '＋ ' + cfg.addLabel;
      list.appendChild(add);
      if (!items.length) {
        var em = document.createElement('span'); em.className = 'fempty'; em.textContent = cfg.empty;
        list.insertBefore(em, add);
      }
      if (ed) openPop(ed.i >= 0 ? list.querySelector('.fchip[data-i="' + ed.i + '"]') : add, ed.i);
    }

    list.addEventListener('click', function (e) {
      var chip = e.target.closest('.fchip'), add = e.target.closest('.fadd');
      if (chip) { var i = parseInt(chip.dataset.i, 10); ed = (ed && ed.i === i) ? null : { i: i }; render(); }
      else if (add) { ed = { i: -1 }; render(); }
    });
    list.addEventListener('mouseover', function (e) { var c = e.target.closest('.fchip'); if (c && !drag) showTip(c, specs[c.dataset.n]); });
    list.addEventListener('mouseout', function (e) { if (e.target.closest('.fchip')) hideTip(); });

    bar.addEventListener('click', function (e) {
      var a = e.target.closest('[data-act]'); if (!a || !ed) return;
      if (a.dataset.act === 'save') commit();
      else if (a.dataset.act === 'cancel') cancel();
      else if (a.dataset.act === 'del') { items.splice(ed.i, 1); ed = null; save(); render(); }
    });
    bar.addEventListener('keydown', function (e) {
      var t = e.target; if (!t.classList || e.isComposing || e.keyCode === 229) return;
      var isN = t.classList.contains('fname'), isS = t.classList.contains('fspec');
      if (!isN && !isS) return;
      if (e.key === 'Escape') cancel();
      else if (e.key === 'Enter' && (isN || e.ctrlKey || e.metaKey)) { e.preventDefault(); commit(); }
    });
    document.addEventListener('mousedown', function (e) {
      if (!ed || bar.contains(e.target)) return;
      commit();
    });

    // 드래그로 순서 변경
    function clearDrop() { var o = list.querySelectorAll('.dropbefore'); for (var i = 0; i < o.length; i++) o[i].classList.remove('dropbefore'); }
    list.addEventListener('dragstart', function (e) {
      var c = e.target.closest('.fchip'); if (!c) return;
      drag = parseInt(c.dataset.i, 10); hideTip(); closePop();
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', c.dataset.n); } catch (x) {}
      c.classList.add('dragging');
    });
    list.addEventListener('dragover', function (e) {
      if (drag === null) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      clearDrop();
      var c = e.target.closest('.fchip'); if (c) c.classList.add('dropbefore');
    });
    list.addEventListener('drop', function (e) {
      if (drag === null) return;
      e.preventDefault(); clearDrop();
      var c = e.target.closest('.fchip');
      var at = c ? parseInt(c.dataset.i, 10) : items.length;
      var name = items[drag];
      if (name !== undefined) {
        items.splice(drag, 1); if (at > drag) at--;
        items.splice(at, 0, name); save();
      }
      drag = null; ed = null; render();
    });
    list.addEventListener('dragend', function () { drag = null; clearDrop(); var d = list.querySelectorAll('.dragging'); for (var i = 0; i < d.length; i++) d[i].classList.remove('dragging'); });

    // 전달 문장 복사
    document.getElementById(cfg.copyId).addEventListener('click', function () {
      var btn = this;
      if (!items.length) return;
      var text = cfg.prefix + items.join(' / ');
      var det = items.filter(function (n) { return (specs[n] || '').trim(); });
      if (det.length) text += '\n\n' + det.map(function (n) { return '[' + n + ']\n' + specs[n].trim(); }).join('\n\n');
      function ok() { var o = btn.textContent; btn.textContent = '✓ 복사됨 · 붙여넣어 전달하세요'; setTimeout(function () { btn.textContent = o; }, 2200); }
      function fallback() {
        var ta = document.createElement('textarea'); ta.value = text;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); ok(); } catch (e) {}
        ta.remove();
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
      else fallback();
    });

    if (localStorage.getItem(KEY) === null) save();
    render();
  }

  initFocus({ key: 'my-focus-v1', barId: 'focusbar', defaults: ['크로마넷 내부문서 만들기', 'CPS 테스트하기'], listId: 'focusList', copyId: 'focusCopy', placeholder: '지금 하는 일', addLabel: '방향', empty: '지금 집중하는 일을 적어두세요', prefix: '지금 제가 집중하고 있는 일: ' });
  initFocus({ key: 'company-focus-v1', barId: 'companyBar', defaults: [], listId: 'companyList', copyId: 'companyCopy', placeholder: '회사가 가는 방향', addLabel: '방향', empty: '회사가 나아가는 방향을 적어두세요', prefix: '지금 우리 회사가 나아가는 방향: ' });
})();
</script>
